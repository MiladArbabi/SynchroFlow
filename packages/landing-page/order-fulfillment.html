  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>laSyncro — Order Fulfillment System<\u002Ftitle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"df74edd2-07cb-4f46-91ac-813d9c11598a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"985d5994-16eb-4a34-86fd-b832c1ebe14a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"df74edd2-07cb-4f46-91ac-813d9c11598a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"985d5994-16eb-4a34-86fd-b832c1ebe14a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --space-1:       #151D29;\n    --space-2:       #1C2740;\n    --space-3:       #243050;\n    --space-4:       #2E3D62;\n\n    --accent:        #FF6B2B;\n    --accent-hover:  #FF8C5A;\n    --accent-ghost:  rgba(255, 107, 43, 0.12);\n    --accent-border: rgba(255, 107, 43, 0.30);\n\n    --ink:           #F0EEE8;\n    --ink-2:         #C8C4BB;\n    --ink-3:         #8B8F9A;\n\n    --rule:          rgba(255, 255, 255, 0.08);\n    --rule-2:        rgba(255, 255, 255, 0.14);\n\n    --ok:            #4ADE80;\n    --font:          'DM Sans', system-ui, sans-serif;\n  }\n\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  html, body { height: 100%; }\n  body {\n    background: var(--space-1);\n    font-family: var(--font);\n    overflow: hidden;\n  }\n\n  .stage {\n    position: fixed; inset: 0;\n    background: var(--space-1);\n    display: flex; align-items: center; justify-content: center;\n    overflow: hidden;\n  }\n\n  /* Outer viewport — the camera frame */\n  .viewport {\n    width: 960px; height: 540px;\n    position: relative;\n    overflow: hidden;\n    background: var(--space-1);\n    transform-origin: center center;\n  }\n\n  /* The whole flowchart lives here; camera = transform on this */\n  #chart {\n    position: absolute; top: 0; left: 0;\n    transform-origin: 0 0;\n  }\n\n  #chart-svg { display: block; }\n  #chart-svg text { font-family: var(--font); }\n\n  /* Step group entry state — initial opacity set inline on each group */\n\n  /* Connector lines start hidden */\n  .connector { opacity: 0; }\n\n  /* Dim the whole chart for the final frame */\n  #chart-content {\n    transition: opacity 600ms ease;\n  }\n\n  /* ---- keyframes ---- */\n  @keyframes iconPulse {\n    0%   { transform: scale(1); }\n    50%  { transform: scale(1.25); }\n    100% { transform: scale(1); }\n  }\n  @keyframes wheelSpin {\n    to { transform: rotate(360deg); }\n  }\n  @keyframes pulseBorder {\n    0%   { stroke-width: 1.5; }\n    50%  { stroke-width: 3; }\n    100% { stroke-width: 1.5; }\n  }\n\n  .pulse-icon {\n    transform-box: fill-box;\n    transform-origin: center;\n    animation: iconPulse 400ms ease-in-out;\n  }\n  .pulse-border {\n    animation: pulseBorder 400ms ease-in-out;\n  }\n  .wheel {\n    transform-box: fill-box;\n    transform-origin: center;\n  }\n  .wheel.spin {\n    animation: wheelSpin 400ms linear 2;\n  }\n\n  /* ---- final brand overlay ---- */\n  .brand {\n    position: absolute; left: 0; right: 0;\n    top: 50%;\n    transform: translateY(-50%) scale(0.94);\n    text-align: center;\n    opacity: 0;\n    transition: opacity 400ms ease-out, transform 400ms ease-out;\n    pointer-events: none;\n  }\n  .brand.show { opacity: 1; transform: translateY(-50%) scale(1); }\n  .brand .b1 {\n    font-family: var(--font);\n    font-weight: 600;\n    font-size: 30px;\n    color: var(--ink);\n    letter-spacing: -0.01em;\n  }\n  .brand .b2 {\n    font-family: var(--font);\n    font-weight: 400;\n    font-size: 14px;\n    color: var(--ink-3);\n    margin-top: 12px;\n  }\n\n  /* ---- progress bar ---- */\n  .progress-track {\n    position: absolute; bottom: 0; left: 0;\n    width: 100%; height: 3px;\n    background: var(--space-3);\n  }\n  .progress-fill {\n    height: 100%; width: 0%;\n    background: var(--accent);\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n\n  <div class=\"stage\">\n    <div class=\"viewport\" id=\"viewport\">\n\n      <div id=\"chart\">\n        <svg id=\"chart-svg\" width=\"960\" height=\"920\" viewBox=\"0 0 960 920\" xmlns=\"http://www.w3.org/2000/svg\">\n          <defs>\n            <marker id=\"arrowhead\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"3\" orient=\"auto\">\n              <path d=\"M0,0 L0,6 L6,3 z\" fill=\"var(--accent)\"><\u002Fpath>\n            <\u002Fmarker>\n          <\u002Fdefs>\n\n          <g id=\"chart-content\">\n\n            <!-- TITLE -->\n            <text id=\"chart-title\" x=\"480\" y=\"38\" text-anchor=\"middle\" fill=\"var(--ink)\" font-size=\"18\" font-weight=\"600\" letter-spacing=\"0.04em\" opacity=\"0\">ORDER FULFILLMENT SYSTEM<\u002Ftext>\n\n            <!-- ============ STEP 1 — ORDERS RECEIVED ============ -->\n            <g class=\"step\" style=\"opacity:0\" id=\"step1\">\n              <rect id=\"step1-card\" x=\"230\" y=\"58\" width=\"500\" height=\"72\" rx=\"12\" fill=\"var(--space-2)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n              <g id=\"step1-icon\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <rect x=\"250\" y=\"72\" width=\"14\" height=\"17\" rx=\"1\"><\u002Frect>\n                <line x1=\"253\" y1=\"76\" x2=\"261\" y2=\"76\"><\u002Fline>\n                <line x1=\"253\" y1=\"80\" x2=\"261\" y2=\"80\"><\u002Fline>\n                <line x1=\"253\" y1=\"84\" x2=\"261\" y2=\"84\"><\u002Fline>\n                <circle cx=\"254\" cy=\"92\" r=\"2.5\"><\u002Fcircle>\n                <circle cx=\"260\" cy=\"92\" r=\"2.5\"><\u002Fcircle>\n                <path d=\"M251,88 h10 v3\"><\u002Fpath>\n              <\u002Fg>\n              <text x=\"298\" y=\"88\" fill=\"var(--ink-3)\" font-size=\"11\" font-weight=\"400\">1.<\u002Ftext>\n              <text x=\"316\" y=\"88\" fill=\"var(--ink)\" font-size=\"12\" font-weight=\"600\">ORDERS RECEIVED<\u002Ftext>\n              <text x=\"316\" y=\"103\" fill=\"var(--ink-3)\" font-size=\"10\" font-weight=\"400\">From sales channels<\u002Ftext>\n            <\u002Fg>\n\n            <line class=\"connector\" id=\"connA\" x1=\"480\" y1=\"130\" x2=\"480\" y2=\"152\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n            <!-- ============ STEP 2 — BLOCK CHECK ============ -->\n            <g class=\"step\" style=\"opacity:0\" id=\"step2\">\n              <rect id=\"step2-card\" x=\"220\" y=\"152\" width=\"520\" height=\"200\" rx=\"12\" fill=\"var(--accent-ghost)\" stroke=\"var(--accent-border)\" stroke-width=\"1.5\"><\u002Frect>\n              <g fill=\"none\" stroke=\"var(--accent)\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <circle cx=\"262\" cy=\"178\" r=\"9\" stroke-width=\"1.5\"><\u002Fcircle>\n                <line x1=\"269\" y1=\"185\" x2=\"276\" y2=\"192\" stroke-width=\"2\"><\u002Fline>\n              <\u002Fg>\n              <text x=\"298\" y=\"182\" fill=\"var(--ink-3)\" font-size=\"11\" font-weight=\"400\">2.<\u002Ftext>\n              <text x=\"316\" y=\"182\" fill=\"var(--ink)\" font-size=\"12\" font-weight=\"600\">BLOCK CHECK<\u002Ftext>\n              <text x=\"316\" y=\"197\" fill=\"var(--ink-3)\" font-size=\"10\" font-weight=\"400\">Check the order<\u002Ftext>\n\n              <!-- Sub-card A — Inventory -->\n              <g id=\"subA\">\n                <rect x=\"232\" y=\"218\" width=\"144\" height=\"54\" rx=\"8\" fill=\"var(--space-3)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n                <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                  <rect x=\"248\" y=\"233\" width=\"10\" height=\"10\" rx=\"1\"><\u002Frect>\n                  <path d=\"M248,233 L253,229 L258,233\"><\u002Fpath>\n                <\u002Fg>\n                <text x=\"268\" y=\"248\" fill=\"var(--ink-2)\" font-size=\"10\" font-weight=\"400\">Inventory<\u002Ftext>\n              <\u002Fg>\n\n              <!-- Sub-card B — Customer -->\n              <g id=\"subB\">\n                <rect x=\"408\" y=\"218\" width=\"144\" height=\"54\" rx=\"8\" fill=\"var(--space-3)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n                <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                  <circle cx=\"428\" cy=\"232\" r=\"5\"><\u002Fcircle>\n                  <path d=\"M418,248 Q428,240 438,248\"><\u002Fpath>\n                <\u002Fg>\n                <text x=\"444\" y=\"248\" fill=\"var(--ink-2)\" font-size=\"10\" font-weight=\"400\">Customer<\u002Ftext>\n              <\u002Fg>\n\n              <!-- Sub-card C — Operational -->\n              <g id=\"subC\">\n                <rect x=\"584\" y=\"218\" width=\"144\" height=\"54\" rx=\"8\" fill=\"var(--space-3)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n                <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                  <circle cx=\"604\" cy=\"237\" r=\"5\"><\u002Fcircle>\n                  <g id=\"gear-teeth\"><\u002Fg>\n                <\u002Fg>\n                <text x=\"620\" y=\"248\" fill=\"var(--ink-2)\" font-size=\"10\" font-weight=\"400\">Operational<\u002Ftext>\n              <\u002Fg>\n            <\u002Fg>\n\n            <line class=\"connector\" id=\"connB\" x1=\"480\" y1=\"352\" x2=\"480\" y2=\"374\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n            <!-- ============ STEP 3 — ORDERS POOL ============ -->\n            <g class=\"step\" style=\"opacity:0\" id=\"step3\">\n              <rect id=\"step3-card\" x=\"230\" y=\"374\" width=\"500\" height=\"72\" rx=\"12\" fill=\"var(--space-2)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n              <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <rect x=\"248\" y=\"382\" width=\"14\" height=\"18\" rx=\"1\"><\u002Frect>\n                <rect x=\"251\" y=\"385\" width=\"14\" height=\"18\" rx=\"1\"><\u002Frect>\n                <rect x=\"254\" y=\"388\" width=\"14\" height=\"18\" rx=\"1\" fill=\"var(--space-2)\"><\u002Frect>\n                <line x1=\"257\" y1=\"392\" x2=\"265\" y2=\"392\"><\u002Fline>\n                <line x1=\"257\" y1=\"396\" x2=\"265\" y2=\"396\"><\u002Fline>\n                <line x1=\"257\" y1=\"400\" x2=\"265\" y2=\"400\"><\u002Fline>\n              <\u002Fg>\n              <text x=\"298\" y=\"400\" fill=\"var(--ink-3)\" font-size=\"11\" font-weight=\"400\">3.<\u002Ftext>\n              <text x=\"316\" y=\"400\" fill=\"var(--ink)\" font-size=\"12\" font-weight=\"600\">ORDERS POOL<\u002Ftext>\n              <text x=\"316\" y=\"415\" fill=\"var(--ink-3)\" font-size=\"10\" font-weight=\"400\">Ready to fulfill<\u002Ftext>\n            <\u002Fg>\n\n            <!-- Release in batches badge -->\n            <g id=\"batch-badge\" style=\"opacity:0\">\n              <rect id=\"batch-pill\" x=\"376\" y=\"454\" width=\"208\" height=\"26\" rx=\"13\" fill=\"var(--accent-ghost)\" stroke=\"var(--accent-border)\" stroke-width=\"1\"><\u002Frect>\n              <text x=\"480\" y=\"471\" text-anchor=\"middle\" fill=\"var(--accent)\" font-size=\"11\" font-weight=\"600\">Release in batches<\u002Ftext>\n            <\u002Fg>\n\n            <line class=\"connector\" id=\"connC1\" x1=\"480\" y1=\"446\" x2=\"480\" y2=\"454\" stroke=\"var(--accent)\" stroke-width=\"1.5\"><\u002Fline>\n            <line class=\"connector\" id=\"connC2\" x1=\"480\" y1=\"480\" x2=\"480\" y2=\"498\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n            <!-- ============ STEP 4 — PICK TOWER ============ -->\n            <g class=\"step\" style=\"opacity:0\" id=\"step4\">\n              <rect id=\"step4-card\" x=\"230\" y=\"498\" width=\"500\" height=\"72\" rx=\"12\" fill=\"var(--space-2)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n              <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <rect x=\"250\" y=\"508\" width=\"9\" height=\"8\" rx=\"1\"><\u002Frect>\n                <rect x=\"262\" y=\"508\" width=\"9\" height=\"8\" rx=\"1\"><\u002Frect>\n                <rect x=\"274\" y=\"508\" width=\"9\" height=\"8\" rx=\"1\"><\u002Frect>\n                <rect x=\"250\" y=\"519\" width=\"9\" height=\"8\" rx=\"1\"><\u002Frect>\n                <rect x=\"262\" y=\"519\" width=\"9\" height=\"8\" rx=\"1\"><\u002Frect>\n                <rect x=\"274\" y=\"519\" width=\"9\" height=\"8\" rx=\"1\"><\u002Frect>\n              <\u002Fg>\n              <text x=\"298\" y=\"528\" fill=\"var(--ink-3)\" font-size=\"11\" font-weight=\"400\">4.<\u002Ftext>\n              <text x=\"316\" y=\"528\" fill=\"var(--ink)\" font-size=\"12\" font-weight=\"600\">PICK TOWER<\u002Ftext>\n              <text x=\"316\" y=\"543\" fill=\"var(--ink-3)\" font-size=\"10\" font-weight=\"400\">Pick the items<\u002Ftext>\n            <\u002Fg>\n\n            <line class=\"connector\" id=\"connD\" x1=\"480\" y1=\"570\" x2=\"480\" y2=\"590\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n            <!-- ============ STEP 5 — PACK STATIONS ============ -->\n            <g class=\"step\" style=\"opacity:0\" id=\"step5\">\n              <rect id=\"step5-card\" x=\"230\" y=\"590\" width=\"500\" height=\"72\" rx=\"12\" fill=\"var(--space-2)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n              <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <rect x=\"248\" y=\"606\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect>\n                <path d=\"M248,606 L244,600\"><\u002Fpath>\n                <path d=\"M266,606 L270,600\"><\u002Fpath>\n              <\u002Fg>\n              <text x=\"298\" y=\"620\" fill=\"var(--ink-3)\" font-size=\"11\" font-weight=\"400\">5.<\u002Ftext>\n              <text x=\"316\" y=\"620\" fill=\"var(--ink)\" font-size=\"12\" font-weight=\"600\">PACK STATIONS<\u002Ftext>\n              <text x=\"316\" y=\"635\" fill=\"var(--ink-3)\" font-size=\"10\" font-weight=\"400\">Pack and label<\u002Ftext>\n            <\u002Fg>\n\n            <line class=\"connector\" id=\"connE\" x1=\"480\" y1=\"662\" x2=\"480\" y2=\"682\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n            <!-- ============ STEP 6 — SHIPPING ============ -->\n            <g class=\"step\" style=\"opacity:0\" id=\"step6\">\n              <rect id=\"step6-card\" x=\"230\" y=\"682\" width=\"500\" height=\"72\" rx=\"12\" fill=\"var(--space-2)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n              <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <rect x=\"244\" y=\"694\" width=\"22\" height=\"14\" rx=\"1\"><\u002Frect>\n                <rect x=\"266\" y=\"697\" width=\"10\" height=\"11\" rx=\"1\"><\u002Frect>\n                <circle cx=\"250\" cy=\"710\" r=\"3.5\"><\u002Fcircle>\n                <circle cx=\"270\" cy=\"710\" r=\"3.5\"><\u002Fcircle>\n              <\u002Fg>\n              <text x=\"298\" y=\"712\" fill=\"var(--ink-3)\" font-size=\"11\" font-weight=\"400\">6.<\u002Ftext>\n              <text x=\"316\" y=\"712\" fill=\"var(--ink)\" font-size=\"12\" font-weight=\"600\">SHIPPING<\u002Ftext>\n              <text x=\"316\" y=\"727\" fill=\"var(--ink-3)\" font-size=\"10\" font-weight=\"400\">Hand off to carrier<\u002Ftext>\n            <\u002Fg>\n\n            <line class=\"connector\" id=\"connF\" x1=\"480\" y1=\"754\" x2=\"480\" y2=\"774\" stroke=\"var(--accent)\" stroke-width=\"1.5\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n            <!-- ============ STEP 7 — BEFORE CPT ============ -->\n            <g class=\"step\" style=\"opacity:0\" id=\"step7\">\n              <rect id=\"step7-card\" x=\"230\" y=\"774\" width=\"500\" height=\"72\" rx=\"12\" fill=\"var(--space-2)\" stroke=\"var(--rule-2)\" stroke-width=\"1\"><\u002Frect>\n              <g fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <path d=\"M257,784 L257,800 Q257,806 265,808 Q273,806 273,800 L273,784 Z\"><\u002Fpath>\n                <path d=\"M261,795 L264,799 L270,792\"><\u002Fpath>\n              <\u002Fg>\n              <text x=\"298\" y=\"804\" fill=\"var(--ink-3)\" font-size=\"11\" font-weight=\"400\">7.<\u002Ftext>\n              <text x=\"316\" y=\"804\" fill=\"var(--ink)\" font-size=\"12\" font-weight=\"600\">BEFORE CPT<\u002Ftext>\n              <text x=\"316\" y=\"819\" fill=\"var(--ink-3)\" font-size=\"10\" font-weight=\"400\">Avoid SLA breaches<\u002Ftext>\n            <\u002Fg>\n\n            <!-- runtime demo elements get appended here so dimming applies -->\n            <g id=\"fx\"><\u002Fg>\n\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <!-- Final brand frame (lives on the viewport, not the camera) -->\n      <div class=\"brand\" id=\"brand\">\n        <div class=\"b1\">laSyncro<\u002Fdiv>\n        <div class=\"b2\">Order fulfillment — fully automated.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Progress bar -->\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progress\"><\u002Fdiv><\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script>\n/* ============================================================\n   TIMELINE  (all ms)\n   ============================================================ */\nconst TIMELINE = {\n  introStart:       0,\n  step1Highlight:   2000,\n  step1ZoomIn:      2300,\n  step1ZoomOut:     5000,\n  step1Connector:   5900,\n\n  step2Highlight:   6400,\n  step2ZoomIn:      6700,\n  step2SubA:        7600,\n  step2SubB:        8100,\n  step2SubC:        8600,\n  step2ClearLine:   9000,\n  step2ClearedLabel:9400,\n  step2ZoomOut:     10200,\n  step2Connector:   11100,\n\n  step3Highlight:   11600,\n  step3ZoomIn:      11900,\n  step3Orders:      12800,\n  step3Badge:       13400,\n  step3Release:     13800,\n  step3ZoomOut:     14400,\n  step3Connector:   15300,\n\n  step4Highlight:   15800,\n  step4ZoomIn:      16100,\n  step4Grid:        17000,\n  step4Pick:        17400,\n  step4Exit:        18000,\n  step4ZoomOut:     18600,\n  step4Connector:   19500,\n\n  step5Highlight:   20000,\n  step5ZoomIn:      20300,\n  step5Boxes:       21200,\n  step5Close:       21700,\n  step5Labels:      22200,\n  step5ZoomOut:     22800,\n  step5Connector:   23700,\n\n  step6Highlight:   24200,\n  step6ZoomIn:      24500,\n  step6Truck:       25400,\n  step6Load:        25800,\n  step6Drive:       26500,\n  step6ZoomOut:     27100,\n  step6Connector:   28000,\n\n  step7Highlight:   28500,\n  step7ZoomIn:      28800,\n  step7Shield:      29700,\n  step7Clock:       30100,\n  step7Label:       30700,\n  step7ZoomOut:     31200,\n\n  finalDim:         32100,\n  finalBrand:       32700,\n  end:              36000,\n};\n\n/* ============================================================\n   HELPERS\n   ============================================================ */\nconst SVGNS = 'http://www.w3.org/2000/svg';\nconst $ = id => document.getElementById(id);\nconst fx = $('fx');\n\nfunction el(tag, attrs = {}, parent = fx) {\n  const e = document.createElementNS(SVGNS, tag);\n  for (const k in attrs) e.setAttribute(k, attrs[k]);\n  if (parent) parent.appendChild(e);\n  return e;\n}\n\n/* --- rAF TWEEN ENGINE ---\n   CSS transitions/animations get starved inside the transformed #chart in some\n   render contexts, so every continuous animation is driven by a manual rAF loop\n   that writes properties DIRECTLY each frame (direct writes always render). */\nconst Ease = {\n  linear: t => t,\n  outCubic: t => 1 - Math.pow(1 - t, 3),\n  inCubic: t => t * t * t,\n  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,\n};\nfunction tween(duration, onUpdate, easing = Ease.inOutCubic, onDone) {\n  const start = performance.now();\n  // setInterval (not rAF) so animation still advances when the iframe is\n  // backgrounded/throttled; progress is wall-clock based so it self-corrects.\n  onUpdate(easing(0), 0);\n  const id = setInterval(() => {\n    let p = duration <= 0 ? 1 : Math.min(1, (performance.now() - start) / duration);\n    onUpdate(easing(p), p);\n    if (p >= 1) { clearInterval(id); if (onDone) onDone(); }\n  }, 16);\n}\n\n/* --- CAMERA --- */\n// Birds-eye fits the full chart into the 540px frame. Defined as a focus\n// point + scale so zoom-out always returns to the exact same framing.\nconst BIRDSEYE = { zx: 480, zy: 452, s: 0.62 };\nlet camState = { ...BIRDSEYE };\n\nfunction setCam(zx, zy, s) {\n  $('chart').style.transform = `translate(${480 - zx * s}px,${270 - zy * s}px) scale(${s})`;\n}\nfunction applyCam(zx, zy, s, duration = 900) {\n  const from = { ...camState };\n  const to = { zx, zy, s };\n  tween(duration, (e) => {\n    const cx = from.zx + (to.zx - from.zx) * e;\n    const cy = from.zy + (to.zy - from.zy) * e;\n    const cs = from.s + (to.s - from.s) * e;\n    setCam(cx, cy, cs);\n  }, Ease.inOutCubic, () => { camState = to; });\n}\nfunction zoomTo(zx, zy, s, duration = 900) { applyCam(zx, zy, s, duration); }\nfunction zoomOut(duration = 900) { applyCam(BIRDSEYE.zx, BIRDSEYE.zy, BIRDSEYE.s, duration); }\n\n/* --- ARROW / PATH draw-in --- */\nfunction animateArrow(node, duration = 300) {\n  const len = node.getTotalLength ? node.getTotalLength() : 30;\n  node.classList.remove('connector');\n  node.style.strokeDasharray = len;\n  node.style.opacity = 1;\n  tween(duration, (e) => { node.style.strokeDashoffset = len * (1 - e); }, Ease.outCubic);\n}\nfunction drawPath(node, duration = 300) {\n  const len = node.getTotalLength();\n  node.style.strokeDasharray = len;\n  node.style.opacity = 1;\n  tween(duration, (e) => { node.style.strokeDashoffset = len * (1 - e); }, Ease.outCubic);\n}\n\n/* --- STEP highlight / reset --- */\nfunction highlightStep(rect, color = 'accent') {\n  const fills   = { accent: 'var(--accent-ghost)', ok: 'rgba(74,222,128,0.07)' };\n  const strokes = { accent: 'var(--accent-border)', ok: 'rgba(74,222,128,0.40)' };\n  rect.style.transition = 'fill 300ms, stroke 300ms, stroke-width 300ms';\n  rect.setAttribute('fill', fills[color]);\n  rect.setAttribute('stroke', strokes[color]);\n  rect.setAttribute('stroke-width', '1.5');\n}\nfunction resetStep(rect) {\n  rect.style.transition = 'fill 300ms, stroke 300ms, stroke-width 300ms';\n  rect.setAttribute('fill', 'var(--space-2)');\n  rect.setAttribute('stroke', 'var(--rule-2)');\n  rect.setAttribute('stroke-width', '1');\n}\n\n/* --- TICKER --- */\nfunction ticker(node, from, to, duration, suffix = '') {\n  const steps = Math.max(1, Math.abs(to - from));\n  const interval = Math.max(6, duration / steps);\n  let current = from;\n  const id = setInterval(() => {\n    current += (to > from ? 1 : -1);\n    node.textContent = current + suffix;\n    if (current === to) clearInterval(id);\n  }, interval);\n}\n\n/* fade helper for runtime nodes — rAF driven */\nfunction fade(node, to, duration = 300) {\n  const from = parseFloat(node.style.opacity || getComputedStyle(node).opacity || '0');\n  tween(duration, (e) => { node.style.opacity = from + (to - from) * e; }, Ease.outCubic);\n}\nfunction clearGroup(g) { while (g.firstChild) g.removeChild(g.firstChild); }\n\n/* Group reveals — rAF driven (direct property writes each frame). */\nfunction appearGroup(g, duration = 320) {\n  g.style.opacity = '0';\n  tween(duration, (e) => { g.style.opacity = e; }, Ease.outCubic);\n}\nfunction appearScale(g, from = 0.8, duration = 300) {\n  g.style.transformBox = 'fill-box';\n  g.style.transformOrigin = 'center';\n  g.style.opacity = '0';\n  tween(duration, (e) => {\n    g.style.opacity = e;\n    g.style.transform = `scale(${from + (1 - from) * e})`;\n  }, Ease.outCubic);\n}\n\n/* leaf-element motion helpers (rAF driven) */\nfunction riseIn(node, dy = 10, duration = 250) {\n  node.style.opacity = '0';\n  tween(duration, (e) => {\n    node.style.opacity = e;\n    node.style.transform = `translateY(${dy * (1 - e)}px)`;\n  }, Ease.outCubic);\n}\nfunction popIn(node, from = 0, duration = 250) {\n  node.style.transformBox = 'fill-box';\n  node.style.transformOrigin = 'center';\n  node.style.opacity = '0';\n  tween(duration, (e) => {\n    node.style.opacity = e;\n    node.style.transform = `scale(${from + (1 - from) * e})`;\n  }, Ease.outCubic);\n}\nfunction slideOutDown(node, dy = 24, duration = 400, onDone) {\n  tween(duration, (e) => {\n    node.style.opacity = 1 - e;\n    node.style.transform = `translateY(${dy * e}px)`;\n  }, Ease.inCubic, onDone);\n}\n\n/* schedule */\nconst timers = [];\nfunction at(key, fn) { timers.push(setTimeout(fn, TIMELINE[key])); }\n\n/* ============================================================\n   BUILD: gear teeth for sub-card C\n   ============================================================ */\n(function buildGear() {\n  const g = $('gear-teeth');\n  for (let i = 0; i < 6; i++) {\n    const a = (i * 60) * Math.PI / 180;\n    const r = 7;\n    const cx = 604 + Math.cos(a) * r;\n    const cy = 237 + Math.sin(a) * r;\n    el('rect', {\n      x: cx - 1.4, y: cy - 1.4, width: 2.8, height: 2.8, rx: 0.6,\n      transform: `rotate(${i * 60} ${cx} ${cy})`,\n      fill: 'none', stroke: 'var(--accent)', 'stroke-width': '1.2'\n    }, g);\n  }\n})();\n\n/* ============================================================\n   PHASE 0 — INTRO\n   ============================================================ */\nfunction intro() {\n  // set initial birds-eye instantly\n  setCam(BIRDSEYE.zx, BIRDSEYE.zy, BIRDSEYE.s);\n  camState = { ...BIRDSEYE };\n\n  // title fade\n  setTimeout(() => { fade($('chart-title'), 1, 400); }, 500);\n\n  // cards fade in, staggered\n  const steps = ['step1','step2','step3','step4','step5','step6','step7'];\n  steps.forEach((s, i) => {\n    setTimeout(() => appearGroup($(s)), 700 + i * 150);\n  });\n\n  // batch badge fades with step 3 region\n  setTimeout(() => appearGroup($('batch-badge')), 700 + 2 * 150);\n}\n\n/* ============================================================\n   PHASE 1 — STEP 1: ORDERS RECEIVED\n   ============================================================ */\nfunction phase1() {\n  at('step1Highlight', () => highlightStep($('step1-card')));\n  at('step1ZoomIn', () => zoomTo(480, 95, 2.2));\n\n  // icon pulse\n  at('step1ZoomIn', () => setTimeout(() => {\n    const ic = $('step1-icon');\n    ic.style.transformBox = 'fill-box';\n    ic.style.transformOrigin = 'center';\n    tween(400, (e) => { ic.style.transform = `scale(${1 + 0.25 * Math.sin(e * Math.PI)})`; },\n      Ease.linear, () => { ic.style.transform = 'scale(1)'; });\n  }, 900));\n\n  // 3 incoming order dots\n  setTimeout(() => {\n    [0,1,2].forEach((i) => {\n      const dot = el('circle', {\n        cx: 430 + i * 13, cy: 100, r: 3, fill: 'var(--ok)', opacity: 0\n      });\n      dot.dataset.p1 = '1';\n      setTimeout(() => popIn(dot, 0, 250), i * 150);\n    });\n  }, TIMELINE.step1ZoomIn + 1300);\n\n  // counter\n  setTimeout(() => {\n    const counter = el('text', {\n      x: 600, y: 99, 'text-anchor': 'middle', fill: 'var(--ink)',\n      'font-size': 14, 'font-weight': 600, opacity: 0\n    });\n    counter.dataset.p1 = '1';\n    counter.textContent = '0 orders';\n    fade(counter, 1, 200);\n    ticker(counter, 0, 312, 700, ' orders');\n    setTimeout(() => fade(counter, 0, 300), 800);\n  }, TIMELINE.step1ZoomIn + 1700);\n\n  at('step1ZoomOut', () => zoomOut());\n  at('step1Connector', () => {\n    resetStep($('step1-card'));\n    fx.querySelectorAll('[data-p1]').forEach(n => n.remove());\n    animateArrow($('connA'));\n  });\n}\n\n/* ============================================================\n   PHASE 2 — STEP 2: BLOCK CHECK\n   ============================================================ */\nfunction phase2() {\n  at('step2Highlight', () => {\n    const r = $('step2-card');\n    tween(400, (e) => { r.setAttribute('stroke-width', (1.5 + 1.5 * Math.sin(e * Math.PI)).toFixed(2)); },\n      Ease.linear, () => r.setAttribute('stroke-width', '1.5'));\n  });\n  at('step2ZoomIn', () => zoomTo(480, 248, 1.8));\n\n  const subs = [\n    { key: 'step2SubA', card: 'subA', x: 232 },\n    { key: 'step2SubB', card: 'subB', x: 408 },\n    { key: 'step2SubC', card: 'subC', x: 584 },\n  ];\n  subs.forEach(s => {\n    at(s.key, () => {\n      const rect = $(s.card).querySelector('rect');\n      rect.style.transition = 'fill 250ms, stroke 250ms';\n      rect.setAttribute('fill', 'var(--accent-ghost)');\n      rect.setAttribute('stroke', 'var(--accent-border)');\n      // draw check\n      const p = el('path', {\n        d: `M${s.x + 108},240 l5,5 l9,-9`,\n        fill: 'none', stroke: 'var(--ok)', 'stroke-width': 2,\n        'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0\n      });\n      p.dataset.p2 = '1';\n      drawPath(p, 300);\n    });\n  });\n\n  // horizontal line connecting check centers\n  at('step2ClearLine', () => {\n    const line = el('line', {\n      x1: 345, y1: 245, x2: 697, y2: 245,\n      stroke: 'var(--ok)', 'stroke-width': 1, opacity: 1\n    });\n    line.dataset.p2 = '1';\n    const len = line.getTotalLength();\n    line.style.strokeDasharray = len;\n    tween(350, (e) => { line.style.strokeDashoffset = len * (1 - e); }, Ease.outCubic,\n      () => setTimeout(() => fade(line, 0, 200), 0));\n  });\n\n  at('step2ClearedLabel', () => {\n    const t = el('text', {\n      x: 480, y: 292, 'text-anchor': 'middle', fill: 'var(--ok)',\n      'font-size': 11, 'font-weight': 400, opacity: 0\n    });\n    t.dataset.p2 = '1';\n    t.textContent = 'Order cleared for fulfillment';\n    fade(t, 1, 300);\n  });\n\n  at('step2ZoomOut', () => zoomOut());\n  at('step2Connector', () => {\n    // step 2 KEEPS its orange treatment; reset only the sub-cards\n    ['subA','subB','subC'].forEach(id => {\n      const rect = $(id).querySelector('rect');\n      rect.style.transition = 'fill 300ms, stroke 300ms';\n      rect.setAttribute('fill', 'var(--space-3)');\n      rect.setAttribute('stroke', 'var(--rule-2)');\n    });\n    fx.querySelectorAll('[data-p2]').forEach(n => fade(n, 0, 300));\n    setTimeout(() => fx.querySelectorAll('[data-p2]').forEach(n => n.remove()), 350);\n    animateArrow($('connB'));\n  });\n}\n\n/* ============================================================\n   PHASE 3 — STEP 3: ORDERS POOL\n   ============================================================ */\nfunction phase3() {\n  at('step3Highlight', () => highlightStep($('step3-card')));\n  at('step3ZoomIn', () => zoomTo(480, 410, 2.2));\n\n  // 5 order rows (right side of card)\n  at('step3Orders', () => {\n    for (let i = 0; i < 5; i++) {\n      const row = el('rect', {\n        x: 490, y: 382 + i * 11, width: 200, height: 8, rx: 2,\n        fill: 'var(--space-3)', stroke: 'var(--rule-2)', 'stroke-width': 1, opacity: 0\n      });\n      row.dataset.p3 = '1';\n      setTimeout(() => riseIn(row, 10, 250), i * 100);\n    }\n  });\n\n  at('step3Badge', () => {\n    const pill = $('batch-pill');\n    pill.setAttribute('stroke', 'var(--accent)');\n    const badge = $('batch-badge');\n    badge.style.transformBox = 'fill-box';\n    badge.style.transformOrigin = 'center';\n    tween(300, (e) => {\n      const s = 1 + 0.05 * Math.sin(e * Math.PI);\n      badge.style.transform = `scale(${s})`;\n    }, Ease.linear, () => { badge.style.transform = 'scale(1)'; });\n    setTimeout(() => pill.setAttribute('stroke', 'var(--accent-border)'), 300);\n  });\n\n  at('step3Release', () => {\n    fx.querySelectorAll('[data-p3]').forEach(row => slideOutDown(row, 24, 400));\n  });\n\n  at('step3ZoomOut', () => zoomOut());\n  at('step3Connector', () => {\n    resetStep($('step3-card'));\n    fx.querySelectorAll('[data-p3]').forEach(n => n.remove());\n    animateArrow($('connC1'), 200);\n    setTimeout(() => animateArrow($('connC2'), 200), 300);\n  });\n}\n\n/* ============================================================\n   PHASE 4 — STEP 4: PICK TOWER\n   ============================================================ */\nfunction phase4() {\n  at('step4Highlight', () => highlightStep($('step4-card')));\n  at('step4ZoomIn', () => zoomTo(480, 534, 2.2));\n\n  const gx = 470, gy = 510;          // grid origin\n  const cw = 16, ch = 14, gp = 4;\n  const cells = [];\n\n  at('step4Grid', () => {\n    let n = 0;\n    for (let r = 0; r < 3; r++) {\n      for (let col = 0; col < 4; col++) {\n        const cell = el('rect', {\n          x: gx + col * (cw + gp), y: gy + r * (ch + gp),\n          width: cw, height: ch, rx: 2,\n          fill: 'var(--space-3)', stroke: 'var(--rule-2)', 'stroke-width': 1, opacity: 0\n        });\n        cell.dataset.p4 = '1';\n        cells.push(cell);\n        setTimeout(() => fade(cell, 1, 150), n * 55);\n        n++;\n      }\n    }\n  });\n\n  // picker cursor moving across 4 cells of row 1\n  at('step4Pick', () => {\n    const cursor = el('g', {}, fx);\n    cursor.dataset.p4 = '1';\n    // palm\n    el('circle', { cx: 0, cy: 6, r: 5, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1 }, cursor);\n    [-3, -1, 1, 3].forEach(dx => el('rect', { x: dx - 0.8, y: -2, width: 1.6, height: 5, rx: 0.6, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1 }, cursor));\n    const targets = [0,1,2,3].map(c => ({ x: gx + c * (cw + gp) + cw / 2, y: gy + ch / 2 - 14 }));\n    const x0 = targets[0].x, x3 = targets[3].x, y = targets[0].y;\n    cursor.style.transform = `translate(${x0}px, ${y}px)`;\n    tween((targets.length - 1) * 350, (e) => {\n      cursor.style.transform = `translate(${x0 + (x3 - x0) * e}px, ${y}px)`;\n    }, Ease.inOutCubic);\n    targets.forEach((t, i) => {\n      setTimeout(() => {\n        const cell = cells[i];\n        if (cell) {\n          cell.setAttribute('fill', 'var(--accent-ghost)');\n          setTimeout(() => cell.setAttribute('fill', 'var(--space-3)'), 250);\n        }\n      }, i * 350);\n    });\n  });\n\n  // 3 boxes exit downward\n  at('step4Exit', () => {\n    for (let i = 0; i < 3; i++) {\n      const box = el('rect', {\n        x: gx + 8 + i * 18, y: gy + 3 * (ch + gp), width: 10, height: 8, rx: 1,\n        fill: 'var(--space-4)', stroke: 'var(--rule-2)', 'stroke-width': 1, opacity: 1\n      });\n      box.dataset.p4 = '1';\n      setTimeout(() => slideOutDown(box, 22, 500), i * 180);\n    }\n    const t = el('text', {\n      x: 590, y: 540, 'text-anchor': 'middle', fill: 'var(--ink-3)',\n      'font-size': 11, 'font-weight': 400, opacity: 0\n    });\n    t.dataset.p4 = '1';\n    t.textContent = '3 items picked';\n    setTimeout(() => { fade(t, 1, 200); setTimeout(() => fade(t, 0, 300), 500); }, 200);\n  });\n\n  at('step4ZoomOut', () => zoomOut());\n  at('step4Connector', () => {\n    resetStep($('step4-card'));\n    fx.querySelectorAll('[data-p4]').forEach(n => n.remove());\n    animateArrow($('connD'));\n  });\n}\n\n/* ============================================================\n   PHASE 5 — STEP 5: PACK STATIONS\n   ============================================================ */\nfunction phase5() {\n  at('step5Highlight', () => highlightStep($('step5-card')));\n  at('step5ZoomIn', () => zoomTo(480, 626, 2.2));\n\n  const boxX = [430, 500, 570], boxY = 630;\n  const lids = [];\n\n  at('step5Boxes', () => {\n    boxX.forEach((bx, i) => {\n      const g = el('g', {}, fx);\n      g.dataset.p5 = '1';\n      g.style.opacity = 0;\n      el('rect', { x: bx, y: boxY, width: 26, height: 18, rx: 1, fill: 'var(--space-3)', stroke: 'var(--accent)', 'stroke-width': 1.5 }, g);\n      // open V lid\n      const lid = el('path', { d: `M${bx},${boxY} L${bx - 5},${boxY - 7} M${bx + 26},${boxY} L${bx + 31},${boxY - 7}`, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g);\n      lid.dataset.bx = bx;\n      lids.push(lid);\n      setTimeout(() => appearScale(g, 0.8, 300), i * 180);\n    });\n  });\n\n  at('step5Close', () => {\n    lids.forEach((lid, i) => {\n      const bx = +lid.dataset.bx;\n      setTimeout(() => {\n        tween(250, (e) => {\n          const lx = (bx - 5) + ((bx + 13) - (bx - 5)) * e;\n          const rx = (bx + 31) + ((bx + 13) - (bx + 31)) * e;\n          const ty = (boxY - 7) + 7 * e;\n          lid.setAttribute('d', `M${bx},${boxY} L${lx},${ty} M${bx + 26},${boxY} L${rx},${ty}`);\n        }, Ease.outCubic);\n      }, i * 200);\n    });\n  });\n\n  at('step5Labels', () => {\n    boxX.forEach((bx, i) => {\n      const strip = el('rect', {\n        x: bx + 3, y: boxY + 2, width: 20, height: 5, rx: 1,\n        fill: 'var(--accent-ghost)', stroke: 'var(--accent-border)', 'stroke-width': 0.5, opacity: 0\n      });\n      strip.dataset.p5 = '1';\n      setTimeout(() => fade(strip, 1, 200), i * 200);\n    });\n    const t = el('text', {\n      x: 500, y: 660, 'text-anchor': 'middle', fill: 'var(--ink-3)',\n      'font-size': 11, 'font-weight': 400, opacity: 0\n    });\n    t.dataset.p5 = '1';\n    t.textContent = 'Packed & labelled';\n    setTimeout(() => fade(t, 1, 300), 200);\n  });\n\n  at('step5ZoomOut', () => zoomOut());\n  at('step5Connector', () => {\n    resetStep($('step5-card'));\n    fx.querySelectorAll('[data-p5]').forEach(n => n.remove());\n    animateArrow($('connE'));\n  });\n}\n\n/* ============================================================\n   PHASE 6 — STEP 6: SHIPPING\n   ============================================================ */\nfunction phase6() {\n  at('step6Highlight', () => highlightStep($('step6-card')));\n  at('step6ZoomIn', () => zoomTo(480, 718, 2.2));\n\n  let truck;\n  at('step6Truck', () => {\n    truck = el('g', {}, fx);\n    truck.dataset.p6 = '1';\n    truck.style.opacity = 0;\n    const bx = 440, by = 716;\n    el('rect', { x: bx, y: by, width: 44, height: 22, rx: 2, fill: 'var(--space-3)', stroke: 'var(--accent)', 'stroke-width': 1.5 }, truck);\n    el('rect', { x: bx + 44, y: by, width: 18, height: 22, rx: 2, fill: 'var(--space-3)', stroke: 'var(--accent)', 'stroke-width': 1.5 }, truck);\n    const w1 = el('circle', { cx: bx + 13, cy: by + 26, r: 6, fill: 'var(--space-1)', stroke: 'var(--accent)', 'stroke-width': 1.5 }, truck);\n    const w2 = el('circle', { cx: bx + 52, cy: by + 26, r: 6, fill: 'var(--space-1)', stroke: 'var(--accent)', 'stroke-width': 1.5 }, truck);\n    w1.classList.add('wheel'); w2.classList.add('wheel');\n    truck.dataset.bx = bx; truck.dataset.by = by;\n    appearScale(truck, 0.9, 300);\n  });\n\n  at('step6Load', () => {\n    const bx = +truck.dataset.bx, by = +truck.dataset.by;\n    for (let i = 0; i < 3; i++) {\n      const box = el('rect', {\n        x: bx + 6 + i * 13, y: by + 6, width: 10, height: 7, rx: 1,\n        fill: 'var(--space-4)', stroke: 'var(--rule-2)', 'stroke-width': 1, opacity: 0\n      });\n      box.dataset.p6 = '1';\n      setTimeout(() => riseIn(box, -14, 300), i * 200);\n    }\n  });\n\n  at('step6Drive', () => {\n    const wheels = [...truck.querySelectorAll('.wheel')];\n    wheels.forEach(w => { w.style.transformBox = 'fill-box'; w.style.transformOrigin = 'center'; });\n    const nodes = [truck];\n    fx.querySelectorAll('[data-p6]').forEach(n => { if (n !== truck) nodes.push(n); });\n    tween(700, (e) => {\n      const tx = 50 * e, op = 1 - e;\n      nodes.forEach(n => { n.style.transform = `translateX(${tx}px)`; n.style.opacity = op; });\n      wheels.forEach(w => { w.style.transform = `rotate(${720 * e}deg)`; });\n    }, Ease.inCubic);\n    const t = el('text', {\n      x: 480, y: 752, 'text-anchor': 'middle', fill: 'var(--ink-3)',\n      'font-size': 11, 'font-weight': 400, opacity: 0\n    });\n    t.dataset.p6 = '1';\n    t.textContent = 'Handed off to carrier';\n    setTimeout(() => fade(t, 1, 300), 300);\n  });\n\n  at('step6ZoomOut', () => zoomOut());\n  at('step6Connector', () => {\n    resetStep($('step6-card'));\n    fx.querySelectorAll('[data-p6]').forEach(n => n.remove());\n    animateArrow($('connF'));\n  });\n}\n\n/* ============================================================\n   PHASE 7 — STEP 7: BEFORE CPT (green success gate)\n   ============================================================ */\nfunction phase7() {\n  at('step7Highlight', () => highlightStep($('step7-card'), 'ok'));\n  at('step7ZoomIn', () => zoomTo(480, 810, 2.2));\n\n  at('step7Shield', () => {\n    const g = el('g', {}, fx);\n    g.dataset.p7 = '1';\n    g.style.opacity = 0;\n    // large shield 44x50 centered ~ (498, 808)\n    el('path', {\n      d: 'M498,786 L498,818 Q498,830 520,836 Q542,830 542,818 L542,786 Z',\n      fill: 'rgba(74,222,128,0.08)', stroke: 'var(--ok)', 'stroke-width': 1.5,\n      'stroke-linejoin': 'round'\n    }, g);\n    el('path', {\n      d: 'M508,808 L517,817 L533,798',\n      fill: 'none', stroke: 'var(--ok)', 'stroke-width': 2.5,\n      'stroke-linecap': 'round', 'stroke-linejoin': 'round'\n    }, g);\n    appearScale(g, 0.5, 400);\n  });\n\n  at('step7Clock', () => {\n    const g = el('g', {}, fx);\n    g.dataset.p7 = '1';\n    const cx = 432, cy = 808;\n    el('circle', { cx, cy, r: 14, fill: 'none', stroke: 'var(--ok)', 'stroke-width': 1.5 }, g);\n    el('circle', { cx, cy, r: 2, fill: 'var(--ok)' }, g);\n    // hour hand (static)\n    el('line', { x1: cx, y1: cy, x2: cx + 5, y2: cy - 5, stroke: 'var(--ok)', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g);\n    // minute hand — animates 0 -> -70deg\n    const min = el('line', { x1: cx, y1: cy, x2: cx, y2: cy - 11, stroke: 'var(--ok)', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, g);\n    min.style.transformBox = 'fill-box';\n    min.style.transformOrigin = 'bottom';\n    min.style.transform = 'rotate(0deg)';\n    tween(600, (e) => { min.style.transform = `rotate(${-70 * e}deg)`; }, Ease.inOutCubic);\n  });\n\n  at('step7Label', () => {\n    const t = el('text', {\n      x: 488, y: 844, 'text-anchor': 'middle', fill: 'var(--ok)',\n      'font-size': 11, 'font-weight': 400, opacity: 0\n    });\n    t.dataset.p7 = '1';\n    t.style.transformBox = 'fill-box';\n    t.style.transformOrigin = 'center';\n    t.textContent = 'SLA protected. Order on time.';\n    tween(300, (e) => {\n      t.style.opacity = e;\n      t.style.transform = `scale(${0.95 + 0.05 * e})`;\n    }, Ease.outCubic);\n  });\n\n  at('step7ZoomOut', () => {\n    zoomOut();\n    // step 7 keeps green; remove zoomed demo elements\n    setTimeout(() => fx.querySelectorAll('[data-p7]').forEach(n => fade(n, 0, 300)), 0);\n    setTimeout(() => fx.querySelectorAll('[data-p7]').forEach(n => n.remove()), 350);\n  });\n}\n\n/* ============================================================\n   PHASE 8 — FINAL FRAME\n   ============================================================ */\nfunction finale() {\n  at('finalDim', () => {\n    const cc = $('chart-content');\n    tween(600, (e) => { cc.style.opacity = 1 - 0.75 * e; }, Ease.outCubic);\n  });\n  at('finalBrand', () => {\n    const b = $('brand');\n    b.style.opacity = '0';\n    tween(400, (e) => {\n      b.style.opacity = e;\n      b.style.transform = `translateY(-50%) scale(${0.94 + 0.06 * e})`;\n    }, Ease.outCubic);\n  });\n}\n\n/* ============================================================\n   VIEWPORT SCALER\n   ============================================================ */\nfunction fit() {\n  const s = Math.min(window.innerWidth / 960, window.innerHeight / 540);\n  $('viewport').style.transform = `scale(${s})`;\n}\nwindow.addEventListener('resize', fit);\n\n/* ============================================================\n   PROGRESS BAR\n   ============================================================ */\nfunction startProgress() {\n  const p = $('progress');\n  tween(TIMELINE.end, (e) => { p.style.width = (e * 100) + '%'; }, Ease.linear);\n}\n\n/* ============================================================\n   RUN\n   ============================================================ */\nfunction run() {\n  fit();\n  intro();\n  startProgress();\n  phase1(); phase2(); phase3(); phase4();\n  phase5(); phase6(); phase7(); finale();\n}\n\nwindow.addEventListener('load', run);\n\n/* dev: press R to restart */\nwindow.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') location.reload(); });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
