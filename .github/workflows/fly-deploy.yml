# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# DEPLOY-GATE-01 — production deployment is manual only. A push to main never
# deploys. Dispatch from main with the full SHA of the certified main commit;
# the run refuses before any migration or deployment unless the ref is main
# and the checked-out commit is exactly that SHA.

name: Fly Deploy
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character SHA of the certified main commit to deploy
        required: true
        type: string

jobs:
  migrate-and-deploy:
    name: Migrate then deploy restricted runtime
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - name: Refuse unless dispatched from main for the expected SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$DISPATCH_REF" != 'refs/heads/main' ]; then
            echo "Deployment must be dispatched from main (got $DISPATCH_REF); refusing." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'expected_sha must be a full 40-character lowercase commit SHA; refusing.' >&2
            exit 1
          fi
          if [ "$DISPATCH_SHA" != "$EXPECTED_SHA" ]; then
            echo "main is at $DISPATCH_SHA, not the expected $EXPECTED_SHA; refusing." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Verify checked-out commit is the expected SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]; then
            echo "Checked out $CHECKED_OUT_SHA, expected $EXPECTED_SHA; refusing." >&2
            exit 1
          fi
          echo "Deploying $CHECKED_OUT_SHA from main."

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Validate generated artifact ownership
        run: npm run check:generated-artifacts

      - name: Build migration runner
        run: |
          npm run build -w modules/shared
          npm run build -w packages/epistemic
          npm run build -w packages/commercial-policy
          npm run build -w packages/backend-core
          SKIP_DEPS=1 npm run build -w apps/backend

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run privileged migrations outside the runtime app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_POSTGRES_APP: ${{ secrets.FLY_POSTGRES_APP }}
          PRIVILEGED_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          test -n "$FLY_POSTGRES_APP"
          test -n "$PRIVILEGED_DATABASE_URL"

          flyctl proxy 15432:5432 -a "$FLY_POSTGRES_APP" > /tmp/fly-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT

          node <<'NODE'
          const net = require('node:net');
          const deadline = Date.now() + 30_000;
          const probe = () => {
            const socket = net.createConnection({ host: '127.0.0.1', port: 15432 });
            socket.once('connect', () => { socket.end(); process.exit(0); });
            socket.once('error', () => {
              socket.destroy();
              if (Date.now() >= deadline) process.exit(1);
              setTimeout(probe, 500);
            });
          };
          probe();
          NODE

          LOCAL_MIGRATION_DATABASE_URL=$(node -e "const u=new URL(process.env.PRIVILEGED_DATABASE_URL);u.hostname='127.0.0.1';u.port='15432';console.log(u.toString())")
          NODE_ENV=production DATABASE_URL="$LOCAL_MIGRATION_DATABASE_URL" \
            node apps/backend/dist/src/scripts/runMigrationsWithChecksum.js

      - name: Reject privileged credentials on the runtime app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl secrets list -a synchroflow | awk 'NR > 1 { print $1 }' | grep -qx DATABASE_URL; then
            echo 'DATABASE_URL is still installed on the runtime app; deployment blocked.' >&2
            exit 1
          fi

      - name: Deploy runtime
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
