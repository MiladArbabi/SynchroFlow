name: CD / Deployment

on:
  push:
    branches:
      - dev-core
      - main
  workflow_dispatch: # Allows manual trigger for emergency deployments

jobs:
  # Define the target environment based on the branch
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

  # Deployment Job: Runs after CI passes
  deploy:
    needs: [determine-environment] # Ensure environment is determined
    # Needs: build-test-node, build-test-cpp # Ideally, you'd add this once you merge the CI jobs
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }} # Select environment based on branch
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Final Production Artifacts
        # Build the optimized Node.js package and C++ shared library
        run: |
          npm install
          npm run build:prod # Define a script for final build

      - name: Configure SSH/Cloud Credentials
        # **ACTION REQUIRED:** You will need to set up your cloud provider keys as GitHub Secrets
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to ${{ needs.determine-environment.outputs.environment }}
        # This is the crucial deployment step. Replace with your actual cloud command.
        run: |
          # Example for deploying to a remote server via SSH/SCP (most flexible option for solo dev)
          # Example: scp -r ./build/* user@your-server-ip:/var/www/synchroflow/${{ needs.determine-environment.outputs.environment }}
          
          echo "Deployment to ${{ needs.determine-environment.outputs.environment }} completed successfully."
          # If using a specific cloud CLI (e.g., gcloud, aws), replace the echo command here.