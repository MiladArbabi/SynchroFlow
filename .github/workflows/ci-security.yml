name: CI / RLS Security Boundary

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/epistemic/**'
      - 'packages/backend-core/**'
      - 'packages/commercial-policy/**'
      - 'scripts/check-conflict-usage.sh'
      - '.github/workflows/ci-security.yml'
      - 'fly.toml'
      - 'tests/integration/fresh-install-release-path.test.ts'
      - 'tests/integration/settings/locked-action-runtime-gh1242.test.ts'
      - 'tests/integration/oauth-callback-provider-mocked.test.ts'
      - 'tests/unit/helpers/auth.ts'
      - 'scripts/with-test-db.js'
      - 'scripts/test-db-safety.js'
      - 'scripts/shopify-reconnect-prerequisites.js'
      - 'tests/setup/backend-integration.runtime-db-guard.js'
      - 'tests/contract/shopify-reconnect-provisioning.contract.test.ts'
      - 'tests/integration/lifecycle/gh1068-*.test.ts'
      - 'tests/unit/backend/shopify/gh1068-*.test.ts'
      - 'tests/unit/backend/workers/b4-s1-sync-consumer-shutdown.test.ts'
      - 'tests/integration/lifecycle/shopify-sync-authority.fixture.ts'
      - 'tests/integration/auth/auth-tenant-01.db.test.ts'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/epistemic/**'
      - 'packages/backend-core/**'
      - 'packages/commercial-policy/**'
      - 'scripts/check-conflict-usage.sh'
      - '.github/workflows/ci-security.yml'
      - 'fly.toml'
      - 'tests/integration/fresh-install-release-path.test.ts'
      - 'tests/integration/settings/locked-action-runtime-gh1242.test.ts'
      - 'tests/integration/oauth-callback-provider-mocked.test.ts'
      - 'tests/unit/helpers/auth.ts'
      - 'scripts/with-test-db.js'
      - 'scripts/test-db-safety.js'
      - 'scripts/shopify-reconnect-prerequisites.js'
      - 'tests/setup/backend-integration.runtime-db-guard.js'
      - 'tests/contract/shopify-reconnect-provisioning.contract.test.ts'
      - 'tests/integration/lifecycle/gh1068-*.test.ts'
      - 'tests/unit/backend/shopify/gh1068-*.test.ts'
      - 'tests/unit/backend/workers/b4-s1-sync-consumer-shutdown.test.ts'
      - 'tests/integration/lifecycle/shopify-sync-authority.fixture.ts'
      - 'tests/integration/auth/auth-tenant-01.db.test.ts'

jobs:
  rls-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sf_user
          POSTGRES_PASSWORD: sf_pass
          POSTGRES_DB: synchroflow_db
        ports:
          - 5432:5432
        # GH-1068 T3: the disposable harness independently verifies this exact
        # container (image, label, tmpfs-only data directory) before any
        # provisioning or destructive DB operation.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --label synchroflow.disposable-test=1
          --health-cmd "pg_isready -U sf_user -d synchroflow_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: synchroflow_db
      PGUSER: sf_user
      PGPASSWORD: sf_pass
      PGMIGRATION_USER: sf_user
      PGMIGRATION_PASSWORD: sf_pass
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      # encryption.service.ts requires test/CI keys to be at least 32 characters.
      ENCRYPTION_KEY: ci-encryption-key-0123456789abcdef
      SHOPIFY_API_KEY: ci-shopify-key
      SHOPIFY_API_SECRET: ci-shopify-secret
      SHOPIFY_API_VERSION: '2025-04'
      DISABLE_QUEUE: '1'
      # email.service.ts constructs a Resend client at module load, so any test
      # importing it throws 'Missing API key' before asserting anything. This
      # value is never used to send — the live regression only needs the module
      # to load. Absent it, subtest 3 has failed on every run since 2026-08-06.
      RESEND_API_KEY: re_ci_placeholder_not_used
      # stripe.verify.middleware.ts:13 constructs a Stripe client at module
      # scope. createApp() imports it transitively, so subtest 3 throws
      # 'Neither apiKey nor config.authenticator provided' before asserting.
      # Placeholder — no Stripe call is made. See BOOT-CRED-01.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate generated artifact ownership
        run: npm run check:generated-artifacts

      - name: Build security boundary
        run: |
          npm run build -w modules/shared
          npm run build -w packages/epistemic
          npm run build -w packages/commercial-policy
          npm run build -w packages/backend-core
          SKIP_DEPS=1 npm run build -w apps/backend

      - name: Run static RLS gates
        run: |
          npm run check:rls -w apps/backend
          npm run test:rls-boundary -w apps/backend

      - name: Run reconnect provisioning contracts
        run: npx --no-install jest --selectProjects contract --testPathPatterns 'shopify-reconnect-provisioning|test-db-safety'

      # GH-1068 T3-B: DB-free sync worker intent gate and dispatcher publish
      # ordering, plus the T2 fence and B4 shutdown contracts they extend.
      - name: Run GH-1068 sync worker and dispatch unit regressions
        run: npx --no-install jest --selectProjects backend-legacy --testPathPatterns 'tests/unit/backend/shopify/gh1068-t3b-sync-worker-dispatch|tests/unit/backend/shopify/gh1068-t2-sync-worker-fence|tests/unit/backend/workers/b4-s1-sync-consumer-shutdown'

      # GH-1068 T3: block external egress BEFORE the first migration. Every
      # later disposable-harness step independently re-verifies this policy;
      # restoration is a dedicated always() step at the end of the job.
      - name: Block external egress for database work
        shell: bash
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # Filter before Docker's localhost PostgreSQL DNAT. No established-
          # connection exception: provider traffic is denied even on open sockets.
          command -v nft
          command -v ip
          command -v python3
          sudo -n true
          # Identify only this job's PostgreSQL service and prove its proxy/route.
          command -v docker
          service_endpoint=$(python3 -I - <<'PY'
          import ipaddress, json, os, re, shlex, subprocess
          def inspect(*args):
              return json.loads(subprocess.check_output(args))
          service_id = os.environ["POSTGRES_SERVICE_ID"]
          assert re.fullmatch(r"[0-9a-f]{64}", service_id)
          container, = inspect("docker", "inspect", service_id)
          assert container["Id"] == service_id
          assert container["Config"]["Image"] == "postgres:16"
          assert container["State"]["Running"]
          bindings = container["NetworkSettings"]["Ports"]["5432/tcp"]
          assert any(b["HostPort"] == "5432" and b["HostIp"] in
                     ("0.0.0.0", "127.0.0.1") for b in bindings)
          attached, = container["NetworkSettings"]["Networks"].values()
          address = ipaddress.IPv4Address(attached["IPAddress"])
          assert address.is_private and not address.is_loopback and not address.is_unspecified
          network, = inspect("docker", "network", "inspect", attached["NetworkID"])
          assert network["Id"] == attached["NetworkID"]
          assert network["Driver"] == "bridge"
          member = network["Containers"][service_id]
          assert ipaddress.ip_interface(member["IPv4Address"]).ip == address
          bridge = (network.get("Options") or {}).get(
              "com.docker.network.bridge.name", "br-" + network["Id"][:12])
          assert re.fullmatch(r"[a-zA-Z0-9_.-]{1,15}", bridge)
          link, = inspect("ip", "-j", "-d", "link", "show", "dev", bridge)
          assert link["linkinfo"]["info_kind"] == "bridge"
          route, = inspect("ip", "-j", "route", "get", str(address))
          assert route["dev"] == bridge and "gateway" not in route
          # A loopback handshake can reach docker-proxy while its separate
          # container connection is dropped by the host OUTPUT policy.
          proxies = subprocess.check_output(["ps", "-eo", "args="], text=True).splitlines()
          confirmed = False
          for line in proxies:
              executable = line.split(None, 1)
              if not executable or os.path.basename(executable[0]) != "docker-proxy":
                  continue
              args = shlex.split(line)
              def flag(name):
                  return args[args.index(name) + 1] if name in args else None
              if (flag("-proto"), flag("-host-port"), flag("-container-ip"),
                  flag("-container-port")) == ("tcp", "5432", str(address), "5432"):
                  if flag("-host-ip") in ("0.0.0.0", "127.0.0.1"):
                      confirmed = True
          assert confirmed, "PostgreSQL Docker proxy forwarding path not confirmed"
          print(address)
          print(bridge)
          PY
          )
          mapfile -t endpoint <<<"$service_endpoint"
          [ "${#endpoint[@]}" = 2 ]
          export PG_SERVICE_IP="${endpoint[0]}"
          export PG_SERVICE_BRIDGE="${endpoint[1]}"
          echo "OAUTH_POSTGRES_FORWARDING=VERIFIED ip=$PG_SERVICE_IP bridge=$PG_SERVICE_BRIDGE port=5432"
          table="auth_oauth_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          export OAUTH_ISOLATION_TABLE="$table"
          # Later harness steps re-verify this exact installed policy.
          echo "OAUTH_ISOLATION_TABLE=$table" >> "$GITHUB_ENV"
          echo "SYNCHROFLOW_TEST_POSTGRES_CONTAINER_ID=$POSTGRES_SERVICE_ID" >> "$GITHUB_ENV"
          sudo -n nft -j list tables | python3 -I -c 'import json,os,sys; assert not any(x.get("table", {}).get("name") == os.environ["OAUTH_ISOLATION_TABLE"] for x in json.load(sys.stdin)["nftables"])'
          # Atomic transaction; never flush or replace existing runner rules.
          sudo -n nft -f - <<RULES
          add table inet $table
          add chain inet $table output { type filter hook output priority -300; policy drop; }
          add rule inet $table output oifname "lo" ip daddr 127.0.0.0/8 accept
          add rule inet $table output oifname "lo" ip6 daddr ::1 accept
          add rule inet $table output oifname "$PG_SERVICE_BRIDGE" ip daddr $PG_SERVICE_IP meta l4proto tcp tcp dport 5432 counter accept
          add rule inet $table output meta nfproto ipv4 counter drop
          add rule inet $table output meta nfproto ipv6 counter drop
          RULES
          # Ensure an IPv6 documentation-address probe reaches the output hook
          # even when the hosted runner has no external IPv6 route.
          sudo -n ip -6 route add 2001:db8::1/128 dev lo
          python3 -I - <<'PY'
          import errno, json, os, socket, subprocess, sys
          table = os.environ["OAUTH_ISOLATION_TABLE"]
          def policy():
              data = json.loads(subprocess.check_output(
                  ["sudo", "-n", "nft", "-j", "list", "table", "inet", table]))
              chains = [x["chain"] for x in data["nftables"] if "chain" in x]
              assert len(chains) == 1
              chain = chains[0]
              assert (chain["family"], chain["name"], chain["type"], chain["hook"],
                      chain["prio"], chain["policy"]) == (
                          "inet", "output", "filter", "output", -300, "drop")
              rules = [x["rule"] for x in data["nftables"] if "rule" in x]
              assert len(rules) == 5
              def match(left, right):
                  return {"match": {"op": "==", "left": left, "right": right}}
              loopback = match({"meta": {"key": "oifname"}}, "lo")
              assert rules[0]["expr"] == [loopback, match(
                  {"payload": {"protocol": "ip", "field": "daddr"}},
                  {"prefix": {"addr": "127.0.0.0", "len": 8}}), {"accept": None}]
              assert rules[1]["expr"] == [loopback, match(
                  {"payload": {"protocol": "ip6", "field": "daddr"}}, "::1"),
                  {"accept": None}]
              bridge_rule = rules[2]["expr"]
              bridge_matches = [
                  match({"meta": {"key": "oifname"}}, os.environ["PG_SERVICE_BRIDGE"]),
                  match({"payload": {"protocol": "ip", "field": "daddr"}},
                        os.environ["PG_SERVICE_IP"])]
              tcp_port = match(
                  {"payload": {"protocol": "tcp", "field": "dport"}}, 5432)
              # nft may omit the redundant l4proto dependency when listing a
              # symbolic TCP payload match. Accept only these two exact forms;
              # raw transport payloads, prefixes, sets and extra actions fail.
              try:
                  assert bridge_rule[:-2] in (
                      bridge_matches + [tcp_port],
                      bridge_matches + [match({"meta": {"key": "l4proto"}}, "tcp"),
                                        tcp_port])
                  assert set(bridge_rule[-2]) == {"counter"}
                  assert bridge_rule[-1] == {"accept": None}
              except AssertionError:
                  # Only nft expressions: no environment or connection secrets.
                  print("OAUTH_POSTGRES_BRIDGE_RULE_JSON=" + json.dumps(bridge_rule),
                        file=sys.stderr)
                  raise
              counts = []
              for rule, family in zip(rules[3:], ["ipv4", "ipv6"]):
                  expressions = rule["expr"]
                  assert len(expressions) == 3
                  assert expressions[0] == match({"meta": {"key": "nfproto"}}, family)
                  assert expressions[2] == {"drop": None}
                  counts.append(expressions[1]["counter"]["packets"])
              return counts
          before = policy()
          # Real packets must hit each family's DROP counter. A denied send alone
          # is insufficient; unrelated routing/socket errors fail the preflight.
          for family, address in [(socket.AF_INET, "192.0.2.1"),
                                  (socket.AF_INET6, "2001:db8::1")]:
              with socket.socket(family, socket.SOCK_DGRAM) as probe:
                  try:
                      probe.sendto(b"oauth-isolation-probe", (address, 9))
                  except OSError as error:
                      if error.errno not in (errno.EPERM, errno.EACCES):
                          raise
          after = policy()
          assert all(end > start for start, end in zip(before, after))
          # Prove both loopback families still work, including dynamic test ports.
          for family, address in [(socket.AF_INET, "127.0.0.1"),
                                  (socket.AF_INET6, "::1")]:
              with socket.socket(family, socket.SOCK_STREAM) as server:
                  server.settimeout(3)
                  server.bind((address, 0))
                  server.listen(1)
                  with socket.create_connection((address, server.getsockname()[1]), 3):
                      connection, _ = server.accept()
                      connection.close()
          print("OAUTH_EGRESS_IPV4=BLOCKED")
          print("OAUTH_EGRESS_IPV6=BLOCKED")
          print("OAUTH_LOOPBACK=PASS")
          PY

      - name: Provision reconnect executor/owner roles before migrations
        env:
          PGUSER: sf_app
          PGPASSWORD: sf_app_pass
          PGMIGRATION_USER: sf_user
          PGMIGRATION_PASSWORD: sf_pass
          # Synthetic, CI-only executor credential; valid only inside this
          # job's disposable service cluster.
          SYNCHROFLOW_TEST_EXECUTOR_PASSWORD: ci-synthetic-reconnect-executor-0123456789abcdef
        run: node scripts/with-test-db.js --provision-only

      - name: Apply migrations and release assertions
        run: npm run migrate -w apps/backend

      - name: Run live RLS and endpoint regressions
        env:
          NODE_ENV: production
          DATABASE_URL: ''
          MIGRATION_DATABASE_URL: postgresql://sf_user:sf_pass@127.0.0.1:5432/synchroflow_db
          APP_DATABASE_URL: postgresql://sf_app:sf_app_pass@127.0.0.1:5432/synchroflow_db
        run: npm run test:rls-live -w apps/backend

      # FRESH-INSTALL-04 — functional Shopify-review regression, not an RLS/
      # security test.
      #
      # Walks the reviewer's path: HMAC install -> seed -> lifecycle ladder ->
      # POST /wms/batch/release, asserting 201 and reservation_hold movements at
      # WH-{shopId}-ROOT. This is the endpoint that regressed during Shopify
      # review (SHOP-REV-02).
      #
      # The preceding RLS checks, migration/release assertions, and live endpoint
      # regressions use the job's normal CI database context where applicable.
      # This functional regression is deliberately different: it runs through
      # scripts/with-test-db.js (via `npm run test:integration`), which generates
      # its own independent synchroflow_test_* database, migrates it, verifies it,
      # and drops it. The functional test itself never uses synchroflow_db.
      #
      # Step-scoped roles: sf_app is the restricted runtime role (non-superuser,
      # non-bypassrls) the harness verifies; sf_user is the migration/admin role
      # that creates and drops the disposable DB. No db:reset / dev_seed /
      # bin-rich tenant rebuild runs — the root-only fresh-install fixture stays
      # owned by tests/integration/fresh-install-release-path.test.ts.
      - name: Run fresh-install release path
        env:
          PGUSER: sf_app
          PGPASSWORD: sf_app_pass
          PGMIGRATION_USER: sf_user
          PGMIGRATION_PASSWORD: sf_pass
          # Synthetic, CI-only executor credential; valid only inside this
          # job's disposable service cluster.
          SYNCHROFLOW_TEST_EXECUTOR_PASSWORD: ci-synthetic-reconnect-executor-0123456789abcdef
        run: npm run test:integration -- --testPathPatterns fresh-install-release-path

      - name: Run GH-1242 locked-action runtime regression
        env:
          PGUSER: sf_app
          PGPASSWORD: sf_app_pass
          PGMIGRATION_USER: sf_user
          PGMIGRATION_PASSWORD: sf_pass
          # Synthetic, CI-only executor credential; valid only inside this
          # job's disposable service cluster.
          SYNCHROFLOW_TEST_EXECUTOR_PASSWORD: ci-synthetic-reconnect-executor-0123456789abcdef
        run: npm run test:integration -- --testPathPatterns locked-action-runtime-gh1242.test.ts

      - name: Run OAuth callback regression with external egress blocked
        shell: bash
        timeout-minutes: 20
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: sf_app
          PGPASSWORD: sf_app_pass
          PGMIGRATION_USER: sf_user
          PGMIGRATION_PASSWORD: sf_pass
          # Synthetic, CI-only executor credential; valid only inside this
          # job's disposable service cluster.
          SYNCHROFLOW_TEST_EXECUTOR_PASSWORD: ci-synthetic-reconnect-executor-0123456789abcdef
          SHOPIFY_API_KEY: ci-shopify-key
          SHOPIFY_API_SECRET: ci-shopify-secret
          RESEND_API_KEY: re_ci_placeholder_not_used
          STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_used
        run: |
          set -euo pipefail
          # Real protocol/authentication proof after installing the restriction.
          # Explicit connection fields match the canonical harness's roles/DBs.
          node <<'JS'
          const assert = require('node:assert/strict');
          const { Client } = require('pg');
          async function verify(label, user, password, database) {
            const client = new Client({
              host: process.env.PGHOST, port: Number(process.env.PGPORT),
              user, password, database, connectionTimeoutMillis: 5000,
              query_timeout: 5000,
            });
            try {
              await client.connect();
              const { rows } = await client.query(
                'SELECT 1 AS ok, current_user AS usr, current_database() AS db, ' +
                'rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user');
              assert.equal(rows.length, 1);
              assert.equal(rows[0].ok, 1);
              assert.equal(rows[0].usr, user);
              assert.equal(rows[0].db, database);
              if (label === 'RUNTIME') {
                assert.equal(rows[0].rolsuper, false);
                assert.equal(rows[0].rolbypassrls, false);
              }
              console.log('OAUTH_POSTGRES_' + label + '_SELECT_1=PASS');
            } finally {
              await client.end();
            }
          }
          (async () => {
            assert.equal(process.env.PGHOST, '127.0.0.1');
            assert.equal(process.env.PGPORT, '5432');
            assert.equal(process.env.PGUSER, 'sf_app');
            assert.equal(process.env.PGMIGRATION_USER, 'sf_user');
            await verify('MIGRATION', process.env.PGMIGRATION_USER,
              process.env.PGMIGRATION_PASSWORD, 'postgres');
            await verify('RUNTIME', process.env.PGUSER,
              process.env.PGPASSWORD, process.env.PGDATABASE);
          })().catch(error => {
            console.error('OAUTH_DB_PREFLIGHT=FAIL code=' + (error.code || error.name));
            process.exitCode = 1;
          });
          JS
          # Authenticated sessions must actually traverse the narrow exception.
          sudo -n nft -j list table inet "$OAUTH_ISOLATION_TABLE" | python3 -I -c 'import json,sys; rules=[x["rule"] for x in json.load(sys.stdin)["nftables"] if "rule" in x]; assert rules[2]["expr"][-2]["counter"]["packets"] > 0'
          echo "OAUTH_POSTGRES_BRIDGE_FORWARDING=PASS"
          echo "OAUTH_ISOLATION_PREFLIGHT=PASS"
          npm run test:integration -- --testPathPatterns oauth-callback-provider-mocked.test.ts

      - name: Run GH-1068 reconnect executor regressions with real principals
        timeout-minutes: 20
        env:
          PGUSER: sf_app
          PGPASSWORD: sf_app_pass
          PGMIGRATION_USER: sf_user
          PGMIGRATION_PASSWORD: sf_pass
          # Synthetic, CI-only executor credential; valid only inside this
          # job's disposable service cluster.
          SYNCHROFLOW_TEST_EXECUTOR_PASSWORD: ci-synthetic-reconnect-executor-0123456789abcdef
        run: npm run test:integration -- --testPathPatterns 'gh1068-t3-reconnect-executor|gh1068-t3-reconnect-fresh-sync|gh1068-t3-reconnect-reset-auth-boundary|gh1068-t3b-durable-sync-dispatch|gh1068-t2-sync-status-races|auth-tenant-01\.db'

      - name: Restore runner network
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          table="auth_oauth_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          result=0
          if sudo -n ip -6 route show 2001:db8::1/128 dev lo | grep -q .; then
            sudo -n ip -6 route del 2001:db8::1/128 dev lo || result=1
          fi
          if sudo -n nft list table inet "$table" >/dev/null 2>&1; then
            sudo -n nft delete table inet "$table" || result=1
            if sudo -n nft list table inet "$table" >/dev/null 2>&1; then result=1; fi
            echo "OAUTH_NETWORK_RESTORED=$([ "$result" = 0 ] && echo PASS || echo FAIL)"
          fi
          exit "$result"
