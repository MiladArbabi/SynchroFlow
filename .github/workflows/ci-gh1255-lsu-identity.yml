# GH-1255 LSU-IDENTITY-01 — egress-isolated certification of the LSU identity
# integration suite (tests/integration/wms/lsu-identity-gh1255.test.ts).
#
# Push-only on feat/gh1255-lsu-identity. No pull_request, no workflow_dispatch,
# no main trigger, no deployment, no secrets. General integration-test egress
# isolation stays owned by GH-1204; this job isolates this one suite only.
#
# Trusted preparation (checkout, npm ci, builds, Jest listing) runs on the host
# network. No integration test, migration or project runtime code runs there.
#
# Integration execution runs inside a dedicated Linux network namespace that
# holds only loopback, with no IPv4/IPv6 routes off loopback, and a PostgreSQL 16
# cluster started inside that namespace. Test processes run as the unprivileged
# runner user with no supplementary groups, no capabilities, no_new_privs and
# an explicit environment allowlist with synthetic provider values only.
# Negative canaries (fetch, HTTPS, raw TCP/UDP over IPv4 and IPv6, DNS, curl,
# sudo, Docker socket, network admin) and positive loopback PostgreSQL checks
# must pass before Jest starts; any failure stops the job before tests run.

name: CI / GH-1255 LSU identity (egress-isolated)

on:
  push:
    branches: [feat/gh1255-lsu-identity]
    paths:
      - '.github/workflows/ci-gh1255-lsu-identity.yml'
      - 'apps/backend/migrations/20261014120000_0212_inventory_unit_lsu_sequence.ts'
      - 'apps/backend/src/services/wms/inventoryUnit.service.ts'
      - 'apps/backend/src/services/wms/unitLabelPdf.service.ts'
      - 'tests/integration/wms/lsu-identity-gh1255.test.ts'
      - 'tests/integration/inventory/inventory-unit-source-issuance.test.ts'
      - 'tests/integration/wms/receive-barcode-readiness-1085.test.ts'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lsu-identity-isolated:
    name: GH-1255 LSU identity suite (network-namespace isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact SHA and clean checkout
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "Checked out $actual, expected $GITHUB_SHA; refusing." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'Checkout is not clean; refusing.' >&2
            exit 1
          fi
          echo "GH1255_CI_SHA=$actual"

      - name: Refuse any .env file and any secret reference
        run: |
          if [ -e .env ]; then
            echo 'Repository root .env is present; refusing.' >&2
            exit 1
          fi
          found="$(find . -path ./.git -prune -o -path ./node_modules -prune -o -name '.env' -print)"
          if [ -n "$found" ]; then
            echo "A .env file is present in the checkout; refusing:" >&2
            echo "$found" >&2
            exit 1
          fi
          if grep -nE '[$][{][{][[:space:]]*(secrets[.]|github[.]token)' .github/workflows/ci-gh1255-lsu-identity.yml; then
            echo 'This workflow must not reference secrets or the GitHub token; refusing.' >&2
            exit 1
          fi

      # Fail closed: the certified code base must be an ancestor of HEAD and the
      # only change since it must be the addition of this workflow file.
      - name: Record provenance
        run: |
          WORK="$RUNNER_TEMP/gh1255-isolation"
          mkdir -p "$WORK/artifacts"
          BASE=bdbfcc219468ce04dd4c671da6265f886734c5a5
          WORKFLOW=.github/workflows/ci-gh1255-lsu-identity.yml
          expected="$(printf 'A\t%s' "$WORKFLOW")"
          verdict=pass
          changes=''
          if git merge-base --is-ancestor "$BASE" HEAD; then
            ancestor=true
            changes="$(git diff --no-ext-diff --name-status "$BASE..HEAD")"
            [ "$changes" = "$expected" ] || verdict=fail
          else
            ancestor=false
            verdict=fail
          fi
          [ -f "$WORKFLOW" ] || verdict=fail
          {
            echo "head_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "certified_code_base=$BASE"
            echo "certified_code_base_is_ancestor=$ancestor"
            echo "changes_since_certified_code_base:"
            [ -z "$changes" ] || printf '%s\n' "$changes"
            echo "provenance_check=$verdict"
          } | tee "$WORK/artifacts/provenance.txt"
          if [ "$verdict" != pass ]; then
            echo "Provenance check failed: expected exactly '$expected' since $BASE; refusing." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build backend
        run: |
          npm run build -w modules/shared
          npm run build -w packages/epistemic
          npm run build -w packages/commercial-policy
          npm run build -w packages/backend-core
          SKIP_DEPS=1 npm run build -w apps/backend

      - name: Validate generated artifact ownership
        run: npm run check:generated-artifacts

      - name: Verify Jest selects exactly the GH-1255 suite
        run: |
          expected="$GITHUB_WORKSPACE/tests/integration/wms/lsu-identity-gh1255.test.ts"
          listed="$(npx --no-install jest --selectProjects backend-integration --listTests --testPathPatterns lsu-identity-gh1255.test.ts)"
          mapfile -t files <<< "$listed"
          if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$expected" ]; then
            echo 'Jest did not select exactly the GH-1255 suite; refusing. Listed:' >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "GH1255_JEST_SELECTED=${files[0]}"

      - name: Check isolation prerequisites (fail closed)
        run: |
          for tool in sudo unshare setpriv runuser ip curl getent; do
            command -v "$tool" >/dev/null || { echo "Missing $tool; refusing." >&2; exit 1; }
          done
          setpriv --help | grep -q -- '--no-new-privs' || { echo 'setpriv lacks --no-new-privs; refusing.' >&2; exit 1; }
          setpriv --help | grep -q -- '--bounding-set' || { echo 'setpriv lacks --bounding-set; refusing.' >&2; exit 1; }
          sudo -n true || { echo 'Passwordless sudo is unavailable; refusing.' >&2; exit 1; }
          PGBIN=/usr/lib/postgresql/16/bin
          for bin in initdb pg_ctl postgres psql; do
            [ -x "$PGBIN/$bin" ] || { echo "PostgreSQL 16 $bin not found at $PGBIN; refusing." >&2; exit 1; }
          done
          "$PGBIN/postgres" --version | grep -Eq '^postgres \(PostgreSQL\) 16\.' || { echo 'PostgreSQL binaries are not version 16; refusing.' >&2; exit 1; }
          id -u postgres >/dev/null || { echo 'No postgres system user; refusing.' >&2; exit 1; }
          "$PGBIN/postgres" --version
          uname -r
          grep -E '^hosts:' /etc/nsswitch.conf || true

      # Optional diagnostic only. It is not a prerequisite for, or a substitute
      # for, the namespace checks; it never fails the job.
      - name: Host network diagnostic (optional, non-gating)
        run: |
          node -e "
            const s = require('net').connect(443, '1.1.1.1');
            const done = (r) => { console.log('HOST_DIAGNOSTIC_TCP_1_1_1_1_443=' + r); s.destroy(); };
            s.setTimeout(5000);
            s.on('connect', () => done('connected'));
            s.on('timeout', () => done('timeout'));
            s.on('error', (e) => done('error:' + e.code));
          " || true

      - name: Prepare isolation scripts
        run: |
          WORK="$RUNNER_TEMP/gh1255-isolation"
          mkdir -p "$WORK/home" "$WORK/tmp" "$WORK/logs" "$WORK/artifacts"
          chmod 700 "$WORK/home" "$WORK/tmp" "$WORK/logs"

          # ── Root half: runs as root inside the new network namespace. ──
          cat > "$WORK/namespace-root.sh" <<'ROOT_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          cd /
          : "${GH1255_WORK:?}" "${GH1255_REPO:?}" "${GH1255_RUN_UID:?}" "${GH1255_RUN_GID:?}" "${GH1255_NODE_DIR:?}"

          PGBIN=/usr/lib/postgresql/16/bin
          PGROOT=''
          pg_started=0

          finish() {
            local rc=$?
            set +e
            if [ "$pg_started" = 1 ]; then
              runuser -u postgres -- "$PGBIN/pg_ctl" -D "$PGROOT/data" -m fast -w -t 60 stop >/dev/null 2>&1
              runuser -u postgres -- "$PGBIN/pg_ctl" -D "$PGROOT/data" status >/dev/null 2>&1
              local st=$?
              if [ "$st" = 3 ]; then
                echo 'GH1255_NS_PG_STOPPED=1'
              else
                echo "GH1255_NS_PG_STOP_FAILED status=$st" >&2
                [ "$rc" = 0 ] && rc=1
              fi
            fi
            if [ "$rc" != 0 ] && [ -n "$PGROOT" ] && [ -f "$PGROOT/server.log" ]; then
              echo '::group::Namespace PostgreSQL server log (tail)'
              tail -n 60 "$PGROOT/server.log"
              echo '::endgroup::'
            fi
            [ -n "$PGROOT" ] && rm -rf "$PGROOT"
            echo "GH1255_NAMESPACE_EXIT=$rc"
            exit "$rc"
          }
          trap finish EXIT

          [ "$(id -u)" = 0 ] || { echo 'GH1255_NS_FAIL namespace setup is not root' >&2; exit 1; }

          # ── Network: loopback only, no routes off loopback. ──
          ip link set lo up
          links="$(ip -o link show | awk -F': ' '{print $2}' | sed 's/@.*//' | sort -u | tr '\n' ' ')"
          if [ "$links" != 'lo ' ]; then
            echo "GH1255_NS_FAIL interfaces other than lo: $links" >&2
            exit 1
          fi
          for fam in -4 -6; do
            routes="$(ip "$fam" route show table all)"
            offlo="$(printf '%s\n' "$routes" | grep -vE ' dev lo( |$)' | grep -v '^$' || true)"
            defaults="$(printf '%s\n' "$routes" | grep -E '^default' || true)"
            if [ -n "$offlo" ] || [ -n "$defaults" ]; then
              echo "GH1255_NS_FAIL route off loopback ($fam):" >&2
              printf '%s\n%s\n' "$offlo" "$defaults" >&2
              exit 1
            fi
          done
          echo '::group::Namespace interfaces and routes'
          ip -o link show
          ip -4 route show table all
          ip -6 route show table all
          echo '::endgroup::'
          echo 'GH1255_NS_LOOPBACK_ONLY=1'

          # ── PostgreSQL 16, initialised and started inside the namespace. ──
          PGROOT="$(mktemp -d /tmp/gh1255-pg.XXXXXX)"
          chown postgres:postgres "$PGROOT"
          chmod 700 "$PGROOT"
          runuser -u postgres -- mkdir -m 700 "$PGROOT/data" "$PGROOT/sock"
          runuser -u postgres -- "$PGBIN/initdb" -D "$PGROOT/data" -U postgres \
            --auth-local=peer --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8 >/dev/null
          pg_started=1
          runuser -u postgres -- "$PGBIN/pg_ctl" -D "$PGROOT/data" -l "$PGROOT/server.log" -w -t 60 \
            -o "-c listen_addresses=127.0.0.1 -c port=5432 -c unix_socket_directories=$PGROOT/sock" start >/dev/null
          echo 'GH1255_NS_PG_STARTED=1'

          adm() {
            runuser -u postgres -- "$PGBIN/psql" -X -q -v ON_ERROR_STOP=1 \
              -h "$PGROOT/sock" -p 5432 -U postgres -d postgres "$@"
          }
          # Migration/admin role (mirrors ci-security.yml) and the restricted
          # runtime role. Migration 0105 creates sf_app only if it is absent.
          adm -c "CREATE ROLE sf_user LOGIN SUPERUSER PASSWORD 'sf_pass'"
          adm -c "CREATE ROLE sf_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'sf_app_pass'"
          adm -c 'CREATE DATABASE synchroflow_db OWNER sf_user'
          echo 'GH1255_NS_ROLES_PROVISIONED=sf_user,sf_app'

          # ── Drop to the unprivileged runner with an explicit env allowlist. ──
          setpriv --reuid="$GH1255_RUN_UID" --regid="$GH1255_RUN_GID" --clear-groups \
            --no-new-privs --inh-caps=-all --bounding-set=-all -- \
            env -i \
              PATH="$GH1255_NODE_DIR:/usr/local/bin:/usr/bin:/bin" \
              HOME="$GH1255_WORK/home" \
              TMPDIR="$GH1255_WORK/tmp" \
              LANG=C.UTF-8 \
              CI=true \
              NODE_ENV=test \
              PGHOST=127.0.0.1 \
              PGPORT=5432 \
              PGDATABASE=synchroflow_db \
              PGUSER=sf_app \
              PGPASSWORD=sf_app_pass \
              PGMIGRATION_USER=sf_user \
              PGMIGRATION_PASSWORD=sf_pass \
              JWT_SECRET=ci-jwt-secret \
              JWT_REFRESH_SECRET=ci-refresh-secret \
              ENCRYPTION_KEY=ci-encryption-key-0123456789abcdef \
              SHOPIFY_API_KEY=synthetic-shopify-api-key \
              SHOPIFY_API_SECRET=synthetic-shopify-api-secret \
              SHOPIFY_API_VERSION=2025-04 \
              RESEND_API_KEY=synthetic-resend-api-key \
              STRIPE_SECRET_KEY=synthetic-stripe-secret-key \
              DISABLE_QUEUE=1 \
              GH1255_WORK="$GH1255_WORK" \
              GH1255_REPO="$GH1255_REPO" \
              GH1255_EXPECT_UID="$GH1255_RUN_UID" \
              GH1255_EXPECT_GID="$GH1255_RUN_GID" \
              /bin/bash "$GH1255_WORK/isolated-run.sh"
          ROOT_EOF

          # ── Unprivileged half: runner uid, inside the same namespace. ──
          cat > "$WORK/isolated-run.sh" <<'RUN_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          cd "$GH1255_REPO"

          LOGS="$GH1255_WORK/logs"
          JEST_JSON="$GH1255_WORK/artifacts/gh1255-jest.json"
          CANARY="$GH1255_WORK/canary.cjs"
          phase=privilege

          # Exactly one create/migrate/runtime-ok/drop per harness log, same DB.
          lifecycle_ok() {
            local f="$1" m
            for m in CREATED MIGRATED RUNTIME_OK DROPPED; do
              [ "$(grep -c "^TEST_DB_$m=" "$f")" = 1 ] || return 1
            done
            [ "$(grep -E '^TEST_DB_(CREATED|MIGRATED|RUNTIME_OK|DROPPED)=' "$f" | cut -d= -f2 | sort -u | wc -l)" = 1 ] || return 1
            ! grep -qE '^(LIFECYCLE_ERROR|CLEANUP_ERROR)=' "$f"
          }

          finish() {
            local rc=$?
            set +e
            echo '::group::GH-1255 disposable database lifecycle evidence'
            local f
            for f in "$LOGS/harness-canary.log" "$LOGS/jest.log"; do
              [ -f "$f" ] || continue
              echo "--- $(basename "$f")"
              grep -E '^(TEST_DB_[A-Z_]+|LIFECYCLE_ERROR|CLEANUP_ERROR)=' "$f"
              if grep -q '^TEST_DB_CREATED=' "$f" && ! lifecycle_ok "$f"; then
                echo "GH1255_LIFECYCLE_INCOMPLETE=$(basename "$f")" >&2
                [ "$rc" = 0 ] && rc=1
              fi
            done
            node "$CANARY" cleanup
            local c=$?
            [ "$c" != 0 ] && [ "$rc" = 0 ] && rc=$c
            echo '::endgroup::'
            echo "GH1255_ISOLATED_PHASE=$phase GH1255_ISOLATED_EXIT=$rc"
            exit "$rc"
          }
          trap finish EXIT

          # ── Privilege boundary. ──
          [ "$(id -u)" = "$GH1255_EXPECT_UID" ] || { echo 'GH1255_PRIV_FAIL unexpected uid' >&2; exit 1; }
          [ "$(id -u)" != 0 ] || { echo 'GH1255_PRIV_FAIL running as root' >&2; exit 1; }
          [ "$(id -G)" = "$GH1255_EXPECT_GID" ] || { echo "GH1255_PRIV_FAIL supplementary groups present: $(id -G)" >&2; exit 1; }
          if sudo -n true >/dev/null 2>&1; then echo 'GH1255_PRIV_FAIL sudo regained privilege' >&2; exit 1; fi
          if ip link add gh1255probe type dummy >/dev/null 2>&1; then
            echo 'GH1255_PRIV_FAIL network administration is possible' >&2
            exit 1
          fi
          echo 'GH1255_PRIV_DROPPED=1'

          # ── Canaries before any test. ──
          phase=canary
          node "$CANARY" outer
          if curl -sS --max-time 5 -o /dev/null https://example.com/ 2>/dev/null; then
            echo 'GH1255_CANARY_FAIL curl https by hostname succeeded' >&2; exit 1
          fi
          if curl -sS --max-time 5 -o /dev/null -k https://1.1.1.1/ 2>/dev/null; then
            echo 'GH1255_CANARY_FAIL curl https by IP succeeded' >&2; exit 1
          fi
          if getent hosts api.stripe.com >/dev/null 2>&1; then
            echo 'GH1255_CANARY_FAIL NSS resolved an external hostname' >&2; exit 1
          fi
          echo 'GH1255_CANARY_SHELL_REFUSED=curl-hostname,curl-ip,getent'

          # Same canaries as a child of the canonical disposable-DB harness.
          phase=harness-canary
          node scripts/with-test-db.js -- node "$CANARY" harness 2>&1 | tee "$LOGS/harness-canary.log"
          lifecycle_ok "$LOGS/harness-canary.log" || { echo 'GH1255_LIFECYCLE_FAIL harness canary' >&2; exit 1; }

          # ── The GH-1255 suite, exactly. ──
          phase=jest
          npm run test:integration -- --testPathPatterns lsu-identity-gh1255.test.ts \
            --json --outputFile="$JEST_JSON" 2>&1 | tee "$LOGS/jest.log"
          lifecycle_ok "$LOGS/jest.log" || { echo 'GH1255_LIFECYCLE_FAIL jest run' >&2; exit 1; }

          phase=assert
          node "$CANARY" jest-json "$JEST_JSON"
          echo "GH1255_REFUSED_EGRESS_INDICATORS=$(grep -cE 'ENETUNREACH|EAI_AGAIN|ENOTFOUND|ECONNREFUSED|TEST_EXTERNAL_EMAIL_BLOCKED' "$LOGS/jest.log" || true)"
          phase=done
          RUN_EOF

          # ── Canaries and machine assertions (Node, CommonJS). ──
          cat > "$WORK/canary.cjs" <<'CANARY_EOF'
          'use strict';
          // GH-1255 isolation canaries. Modes: outer | harness | cleanup | jest-json <file>.
          // Never prints environment values.
          const fs = require('fs');
          const net = require('net');
          const https = require('https');
          const dgram = require('dgram');
          const dns = require('dns');
          const path = require('path');
          const { createRequire } = require('module');

          const repo = process.env.GH1255_REPO;
          const { Client } = createRequire(path.join(repo, 'package.json'))('pg');
          const mode = process.argv[2];
          const failures = [];
          const fail = (msg) => { failures.push(msg); console.error('GH1255_CANARY_FAIL ' + msg); };
          const ok = (msg) => console.log('GH1255_CANARY_OK ' + msg);
          const TIMEOUT_MS = 8000;

          const ALLOWED_ENV = new Set([
            'PATH', 'HOME', 'TMPDIR', 'LANG', 'CI', 'NODE_ENV', 'PWD', 'OLDPWD', 'SHLVL', '_',
            'PGHOST', 'PGPORT', 'PGDATABASE', 'PGUSER', 'PGPASSWORD', 'PGMIGRATION_USER', 'PGMIGRATION_PASSWORD',
            'JWT_SECRET', 'JWT_REFRESH_SECRET', 'ENCRYPTION_KEY',
            'SHOPIFY_API_KEY', 'SHOPIFY_API_SECRET', 'SHOPIFY_API_VERSION', 'RESEND_API_KEY', 'STRIPE_SECRET_KEY',
            'DISABLE_QUEUE', 'GH1255_WORK', 'GH1255_REPO', 'GH1255_EXPECT_UID', 'GH1255_EXPECT_GID',
          ]);
          const HARNESS_ENV = new Set(['SYNCHROFLOW_DISPOSABLE_TEST_DB']);

          function checkEnvironment(allowHarness) {
            const names = Object.keys(process.env);
            const extra = names.filter((n) => !ALLOWED_ENV.has(n) && !(allowHarness && HARNESS_ENV.has(n)));
            if (extra.length) fail('environment names outside allowlist: ' + extra.join(','));
            const proxies = names.filter((n) => /proxy/i.test(n));
            if (proxies.length) fail('proxy configuration inherited: ' + proxies.join(','));
            const providers = names.filter((n) => /SHOPIFY|STRIPE|RESEND/.test(n) && n !== 'SHOPIFY_API_VERSION');
            const real = providers.filter((n) => !String(process.env[n]).startsWith('synthetic-'));
            if (real.length) fail('non-synthetic provider values: ' + real.join(','));
            if (!extra.length && !proxies.length && !real.length) ok('environment allowlist, no proxy, synthetic providers (' + providers.join(',') + ')');
          }

          function checkProcess() {
            const status = fs.readFileSync('/proc/self/status', 'utf8');
            const field = (k) => ((status.match(new RegExp('^' + k + ':\\s*(.*)$', 'm')) || [])[1] || '').trim();
            const uid = process.env.GH1255_EXPECT_UID;
            const gid = process.env.GH1255_EXPECT_GID;
            if (!field('Uid').split(/\s+/).every((v) => v === uid)) fail('uid is not the unprivileged runner');
            if (!field('Gid').split(/\s+/).every((v) => v === gid)) fail('gid is not the runner group');
            if (field('Groups') !== '') fail('supplementary groups present');
            for (const cap of ['CapInh', 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb']) {
              if (!/^0+$/.test(field(cap))) fail(cap + ' is not empty');
            }
            if (field('NoNewPrivs') !== '1') fail('no_new_privs is not set');
            ok('uid/gid ' + uid + '/' + gid + ', no groups, no capabilities, no_new_privs');
          }

          function checkNamespace() {
            const dev = fs.readFileSync('/proc/net/dev', 'utf8').split('\n').slice(2)
              .map((l) => l.split(':')[0].trim()).filter(Boolean);
            if (dev.length !== 1 || dev[0] !== 'lo') fail('interfaces other than lo: ' + dev.join(','));
            const v4 = fs.readFileSync('/proc/net/route', 'utf8').split('\n').slice(1).filter(Boolean)
              .map((l) => l.split(/\s+/)[0]);
            const v6 = fs.readFileSync('/proc/net/ipv6_route', 'utf8').split('\n').filter(Boolean)
              .map((l) => l.trim().split(/\s+/).pop());
            const offlo = v4.concat(v6).filter((d) => d !== 'lo');
            if (offlo.length) fail('routes off loopback: ' + offlo.join(','));
            ok('namespace interfaces [' + dev.join(',') + '], ' + v4.length + ' IPv4 / ' + v6.length + ' IPv6 routes, all on lo');
          }

          function withTimeout(promise, name) {
            let t;
            return Promise.race([
              promise,
              new Promise((_, rej) => { t = setTimeout(() => rej(Object.assign(new Error('timeout'), { code: 'TIMEOUT' })), TIMEOUT_MS); }),
            ]).finally(() => clearTimeout(t));
          }

          async function mustNotConnect(name, attempt) {
            try {
              await withTimeout(attempt(), name);
              fail(name + ' SUCCEEDED');
            } catch (e) {
              ok(name + ' refused (' + (e.code || (e.cause && e.cause.code) || e.name) + ')');
            }
          }

          const tcp = (host, port) => () => new Promise((resolve, reject) => {
            const s = net.connect({ host, port });
            s.once('connect', () => { s.destroy(); resolve(); });
            s.once('error', (e) => { s.destroy(); reject(e); });
          });
          const httpsGet = (url) => () => new Promise((resolve, reject) => {
            const req = https.get(url, { timeout: TIMEOUT_MS }, (res) => { res.resume(); resolve(); });
            req.once('error', reject);
            req.once('timeout', () => req.destroy(Object.assign(new Error('timeout'), { code: 'TIMEOUT' })));
          });
          const udp = (host, port) => () => new Promise((resolve, reject) => {
            const s = dgram.createSocket('udp4');
            let closed = false;
            const close = () => { if (!closed) { closed = true; try { s.close(); } catch (_) {} } };
            s.once('error', (e) => { close(); reject(e); });
            s.send(Buffer.from('gh1255'), port, host, (e) => { close(); e ? reject(e) : resolve(); });
          });

          async function checkEgress() {
            await mustNotConnect('fetch https://api.stripe.com', () => fetch('https://api.stripe.com/v1/charges', { signal: AbortSignal.timeout(TIMEOUT_MS) }));
            await mustNotConnect('fetch https://api.resend.com', () => fetch('https://api.resend.com/emails', { signal: AbortSignal.timeout(TIMEOUT_MS) }));
            await mustNotConnect('https.get api.resend.com', httpsGet('https://api.resend.com/emails'));
            await mustNotConnect('https.get 1.1.1.1', httpsGet('https://1.1.1.1/'));
            await mustNotConnect('tcp 1.1.1.1:443', tcp('1.1.1.1', 443));
            await mustNotConnect('tcp 8.8.8.8:53', tcp('8.8.8.8', 53));
            await mustNotConnect('tcp [2606:4700:4700::1111]:443', tcp('2606:4700:4700::1111', 443));
            await mustNotConnect('udp 1.1.1.1:53', udp('1.1.1.1', 53));
            await mustNotConnect('dns.lookup api.stripe.com', () => dns.promises.lookup('api.stripe.com'));
            const resolver = new dns.promises.Resolver({ timeout: 2000, tries: 1 });
            await mustNotConnect('dns.resolve4 api.stripe.com', () => resolver.resolve4('api.stripe.com'));
          }

          async function checkDockerSocket() {
            await mustNotConnect('docker socket', () => new Promise((resolve, reject) => {
              const s = net.connect({ path: '/var/run/docker.sock' });
              s.once('connect', () => { s.destroy(); resolve(); });
              s.once('error', (e) => { s.destroy(); reject(e); });
            }));
          }

          async function query(user, password, database, sql, params) {
            const c = new Client({
              host: process.env.PGHOST, port: Number(process.env.PGPORT),
              user, password, database, connectionTimeoutMillis: 10000,
            });
            await c.connect();
            try { return (await c.query(sql, params)).rows; } finally { await c.end(); }
          }
          const asMigration = (db, sql, p) => query(process.env.PGMIGRATION_USER, process.env.PGMIGRATION_PASSWORD, db, sql, p);
          const asRuntime = (db, sql, p) => query(process.env.PGUSER, process.env.PGPASSWORD, db, sql, p);

          async function checkRuntimeRole(db) {
            const [r] = await asRuntime(db, `SELECT current_database() AS db, current_user AS usr, host(inet_server_addr()) AS addr,
              r.rolsuper, r.rolbypassrls, r.rolcreatedb, r.rolcreaterole FROM pg_roles r WHERE r.rolname = current_user`);
            if (r.db !== db || r.usr !== process.env.PGUSER) fail('runtime role connected to the wrong database or as the wrong user');
            if (r.addr !== '127.0.0.1') fail('runtime connection is not loopback');
            if (r.rolsuper || r.rolbypassrls || r.rolcreatedb || r.rolcreaterole) fail('runtime role is not restricted');
            ok('runtime role ' + r.usr + ' on ' + r.db + ' via ' + r.addr + ': rolsuper=' + r.rolsuper + ' rolbypassrls=' + r.rolbypassrls);
          }

          async function outer() {
            checkEnvironment(false);
            checkProcess();
            checkNamespace();
            await checkDockerSocket();
            await checkEgress();
            const [m] = await asMigration('postgres', 'SELECT current_user AS usr, host(inet_server_addr()) AS addr');
            if (m.usr !== process.env.PGMIGRATION_USER || m.addr !== '127.0.0.1') fail('migration role loopback connection');
            await asMigration(process.env.PGDATABASE, 'SELECT 1');
            ok('migration role ' + m.usr + ' via ' + m.addr);
            await checkRuntimeRole(process.env.PGDATABASE);
          }

          async function harness() {
            const db = process.env.PGDATABASE;
            if (!/^synchroflow_test_[A-Za-z0-9_]+$/.test(db || '')) fail('harness child PGDATABASE is not disposable');
            if (process.env.SYNCHROFLOW_DISPOSABLE_TEST_DB !== '1') fail('disposable-DB signal missing');
            if (process.env.NODE_ENV !== 'test') fail('NODE_ENV is not test');
            checkEnvironment(true);
            checkProcess();
            checkNamespace();
            await checkDockerSocket();
            await checkEgress();
            await checkRuntimeRole(db);
            const [mig] = await asMigration(db, `SELECT count(*)::int AS n FROM knex_migrations WHERE name LIKE '%0212_inventory_unit_lsu_sequence%'`);
            if (mig.n !== 1) fail('migration 0212 rows in knex_migrations: ' + mig.n);
            else ok('migration 0212 applied');
            const seqs = await asMigration(db, `SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relkind = 'S' AND n.nspname = 'public' AND c.relname LIKE '%lsu%'`);
            if (seqs.length !== 1 || seqs[0].relname !== 'inventory_unit_lsu_seq') fail('LSU sequences: ' + seqs.map((s) => s.relname).join(','));
            const [p] = await asMigration(db, `SELECT has_sequence_privilege($1, 'public.inventory_unit_lsu_seq', 'USAGE') AS usage,
              has_sequence_privilege($1, 'public.inventory_unit_lsu_seq', 'SELECT') AS sel,
              has_sequence_privilege($1, 'public.inventory_unit_lsu_seq', 'UPDATE') AS upd`, [process.env.PGUSER]);
            if (!(p.usage === true && p.sel === false && p.upd === false)) fail('LSU sequence privileges for runtime role are not USAGE-only');
            else ok('runtime role holds USAGE only on public.inventory_unit_lsu_seq');
          }

          async function cleanup() {
            const [r] = await asMigration('postgres', `SELECT
              (SELECT count(*)::int FROM pg_database WHERE starts_with(datname, 'synchroflow_test_')) AS orphans,
              (SELECT count(*)::int FROM pg_database WHERE datname = $1) AS dev`, [process.env.PGDATABASE]);
            console.log('GH1255_TEST_DB_ORPHANS=' + r.orphans);
            console.log('GH1255_PGDATABASE_PRESENT=' + (r.dev === 1));
            if (r.orphans !== 0) fail('disposable databases remain');
            if (r.dev !== 1) fail('normal PGDATABASE missing');
          }

          const EXPECTED_IDS = {
            R1: 1, R2: 1, R3: 1, R4: 1, R5: 1, R6: 1, R7: 1, R8: 3, R9: 1, R10: 1, R11: 1, R11b: 1,
            R12: 4, R13: 2, R14: 1, R15: 1, R16: 1, R17: 1, R18: 1, R19: 1, R20: 1, R21: 1,
          };

          function jestJson(file) {
            const j = JSON.parse(fs.readFileSync(file, 'utf8'));
            const expectedPath = path.join(repo, 'tests/integration/wms/lsu-identity-gh1255.test.ts');
            const want = {
              numTotalTestSuites: 1, numPassedTestSuites: 1, numFailedTestSuites: 0, numPendingTestSuites: 0,
              numRuntimeErrorTestSuites: 0, numTotalTests: 28, numPassedTests: 28, numFailedTests: 0,
              numPendingTests: 0, numTodoTests: 0,
            };
            for (const [k, v] of Object.entries(want)) {
              if (j[k] !== v) fail('jest ' + k + '=' + j[k] + ' expected ' + v);
            }
            if (j.success !== true) fail('jest success=' + j.success);
            if (!Array.isArray(j.testResults) || j.testResults.length !== 1 || j.testResults[0].name !== expectedPath) {
              fail('jest suite is not exactly ' + expectedPath);
            }
            const results = (j.testResults[0] && j.testResults[0].assertionResults) || [];
            const notPassed = results.filter((a) => a.status !== 'passed');
            if (results.length !== 28 || notPassed.length) fail('assertions: ' + results.length + ' total, ' + notPassed.length + ' not passed');
            const counts = {};
            for (const a of results) {
              const m = /^(R\d+b?) —/.exec(a.title);
              const id = m ? m[1] : 'UNMATCHED';
              counts[id] = (counts[id] || 0) + 1;
            }
            const ids = new Set(Object.keys(counts).concat(Object.keys(EXPECTED_IDS)));
            for (const id of ids) {
              if ((counts[id] || 0) !== (EXPECTED_IDS[id] || 0)) fail('case ' + id + ': ' + (counts[id] || 0) + ' expected ' + (EXPECTED_IDS[id] || 0));
            }
            console.log('GH1255_JEST_SUITES=' + j.numPassedTestSuites + '/' + j.numTotalTestSuites
              + ' TESTS=' + j.numPassedTests + '/' + j.numTotalTests
              + ' FAILED=' + j.numFailedTests + ' PENDING=' + j.numPendingTests + ' TODO=' + j.numTodoTests);
          }

          (async () => {
            if (mode === 'outer') await outer();
            else if (mode === 'harness') await harness();
            else if (mode === 'cleanup') await cleanup();
            else if (mode === 'jest-json') jestJson(process.argv[3]);
            else fail('unknown mode ' + mode);
          })().catch((e) => fail(mode + ' error: ' + (e && e.message)))
            .finally(() => {
              if (failures.length) { console.error('GH1255_CANARY_RESULT=FAIL mode=' + mode); process.exitCode = 1; }
              else console.log('GH1255_CANARY_RESULT=PASS mode=' + mode);
            });
          CANARY_EOF

          chmod 600 "$WORK/canary.cjs"
          chmod 700 "$WORK/namespace-root.sh" "$WORK/isolated-run.sh"

      - name: Run GH-1255 suite inside the isolated network namespace
        run: |
          WORK="$RUNNER_TEMP/gh1255-isolation"
          NODE_DIR="$(dirname "$(command -v node)")"
          # The runner's primary group can be docker, so the test processes run
          # with nogroup instead; file access relies on the runner uid alone.
          RUN_GID="$(getent group nogroup | cut -d: -f3)"
          [ -n "$RUN_GID" ] || { echo 'No nogroup group; refusing.' >&2; exit 1; }
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            GH1255_WORK="$WORK" \
            GH1255_REPO="$GITHUB_WORKSPACE" \
            GH1255_RUN_UID="$(id -u)" \
            GH1255_RUN_GID="$RUN_GID" \
            GH1255_NODE_DIR="$NODE_DIR" \
            unshare --net -- /bin/bash "$WORK/namespace-root.sh"

      # Evidence only: Jest JSON and provenance. No logs, environment or
      # connection material. Upload success never changes a failed job result.
      - name: Upload GH-1255 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh1255-lsu-identity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gh1255-isolation/artifacts/gh1255-jest.json
            ${{ runner.temp }}/gh1255-isolation/artifacts/provenance.txt
          if-no-files-found: warn
          retention-days: 14
