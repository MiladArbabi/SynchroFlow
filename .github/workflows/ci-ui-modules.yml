name: CI — UI modules
on:
  push:
    paths:
      - 'modules/**'
      - 'packages/**'
      - 'package.json'
      - '.gitignore'
      - '.dockerignore'
      - 'Dockerfile'
      - 'scripts/**'
      - 'tests/contract/**'
      - 'tests/unit/ui/floor-planning/**'
      - 'tests/unit/ui/wms/StowSessionScanRail.test.tsx'
      - 'tests/unit/ui/wms/StowSessionFocusUx.test.tsx'
      - 'tests/unit/ui/wms/StowSessionPage.receive-recovery-exact-lsu-i5.test.tsx'
      - 'apps/frontend/**'
      - '.github/workflows/ci-ui-modules.yml'
  pull_request:
    paths:
      - 'modules/**'
      - 'packages/**'
      - 'package.json'
      - '.gitignore'
      - '.dockerignore'
      - 'Dockerfile'
      - 'scripts/**'
      - 'tests/contract/**'
      - 'tests/unit/ui/floor-planning/**'
      - 'tests/unit/ui/wms/StowSessionScanRail.test.tsx'
      - 'tests/unit/ui/wms/StowSessionFocusUx.test.tsx'
      - 'tests/unit/ui/wms/StowSessionPage.receive-recovery-exact-lsu-i5.test.tsx'
      - 'apps/frontend/**'
      - '.github/workflows/ci-ui-modules.yml'

jobs:
  validate-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build:deps

      - name: Validate generated artifact ownership
        run: npm run check:generated-artifacts

      - name: Validate module descriptors
        run: node scripts/validate-modules.js

      - name: Run contract tests
        run: npx jest tests/contract --runInBand

      - name: Run Floor Planning UI regressions
        run: npx --no-install jest --selectProjects frontend --runInBand --watchman=false --testPathPatterns 'tests/unit/ui/floor-planning/|tests/unit/ui/wms/(StowSessionScanRail|StowSessionFocusUx|StowSessionPage[.]receive-recovery-exact-lsu-i5)[.]test[.]tsx$'

  contract-tests:
    runs-on: ubuntu-latest
    needs: validate-modules
    steps:
      - name: Checkout (noop)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify contract tests ran
        run: echo "Contracts validated in validate-modules job"