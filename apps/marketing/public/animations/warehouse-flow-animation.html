  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>laSYNCro — Warehouse Flow</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"508059a0-d135-4bc8-8670-b16a369b7136\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"00557c32-2336-46ef-9a85-653e41bd19d6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"508059a0-d135-4bc8-8670-b16a369b7136\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"00557c32-2336-46ef-9a85-653e41bd19d6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n<style>\n:root{\n  --space-1:#151D29; --space-2:#1C2740; --space-3:#243050; --space-4:#2E3D62;\n  --accent:#FF6B2B; --accent-hover:#FF8C5A; --accent-ghost:rgba(255,107,43,0.12); --accent-border:rgba(255,107,43,0.30);\n  --ink:#F0EEE8; --ink-2:#C8C4BB; --ink-3:#8B8F9A;\n  --rule:rgba(255,255,255,0.08); --rule-2:rgba(255,255,255,0.14);\n  --ok:#4ADE80; --font:'DM Sans',system-ui,sans-serif;\n}\n*{box-sizing:border-box;}\nhtml,body{margin:0;height:100%;background:var(--space-1);font-family:var(--font);overflow:hidden;}\n#fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--space-1);}\n#stage{width:960px;height:648px;position:relative;overflow:hidden;background:var(--space-1);transform-origin:center center;}\n#warehouse{position:absolute;left:0;top:0;width:960px;height:648px;transform-origin:0 0;transform:translate(0,0) scale(1);}\n#warehouse-svg{display:block;width:960px;height:648px;overflow:visible;}\n\n/* zone cards */\n.cardbg{fill:var(--space-3);stroke:var(--rule-2);stroke-width:1;transition:fill .3s ease,stroke .3s ease;}\n.card.hub .cardbg{fill:var(--accent-ghost);stroke:var(--accent-border);stroke-width:1.5;}\n.card.active .cardbg{fill:var(--accent-ghost);stroke:var(--accent-border);stroke-width:1.5;}\n.card{transition:transform .3s ease;transform-origin:center;}\n\n.zlabel{fill:var(--ink);font:600 11px var(--font);letter-spacing:.02em;}\n.zlabel.big{font-size:13px;}\n.zsub{fill:var(--ink-3);font:400 10px var(--font);}\n.ilabel{fill:var(--ink);font:600 10px var(--font);text-anchor:middle;}\n\n.icon{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}\n\n/* arrows */\n.arrow{fill:none;stroke:var(--accent);stroke-width:1.5;}\n.arrow.ghost{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:4 4;}\n.aflabel{fill:var(--accent);font:600 10px var(--font);text-anchor:middle;}\n\n/* dynamic props hidden by default */\n.prop{opacity:0;}\n\n/* progress bar */\n#progress{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--space-3);z-index:5;}\n#progress > i{display:block;height:100%;width:0;background:var(--accent);}\n\n/* final overlays */\n#dim{position:absolute;inset:0;background:var(--space-1);opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:3;}\n#brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transition:opacity .6s ease;z-index:4;pointer-events:none;}\n#brand .mark{width:300px;height:auto;}\n#brand .sub{color:var(--ink-3);font:400 13px var(--font);letter-spacing:.01em;white-space:nowrap;}\n\n/* controls outside stage */\n#ctrl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:20;opacity:0;transition:opacity .3s ease;}\n#ctrl.show{opacity:1;}\n#ctrl button{appearance:none;border:1px solid var(--rule-2);background:rgba(255,255,255,0.04);color:var(--ink-2);font:600 12px var(--font);padding:7px 14px;border-radius:6px;cursor:pointer;letter-spacing:.04em;}\n#ctrl button:hover{background:var(--accent-ghost);border-color:var(--accent-border);color:var(--ink);}\n@keyframes roll{to{transform:rotate(360deg);}}\n.rolling{animation:roll .4s linear infinite;}\n@media (prefers-reduced-motion:reduce){#warehouse{transition:none!important;}}\n</style>\n</head>\n<body>\n\n<div id=\"fit\" data-screen-label=\"00:00\">\n  <div id=\"stage\">\n    <div id=\"warehouse\">\n      <svg id=\"warehouse-svg\" viewBox=\"0 0 960 648\" xmlns=\"http://www.w3.org/2000/svg\">\n        <defs>\n          <marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n            <path d=\"M0,0 L0,6 L6,3 z\" fill=\"var(--accent)\"></path>\n          </marker>\n          <marker id=\"arrow-ghost\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n            <path d=\"M0,0 L0,6 L6,3 z\" fill=\"var(--ink-3)\"></path>\n          </marker>\n        </defs>\n\n        <!-- ===== BOUNDARY ===== -->\n        <rect id=\"boundary\" x=\"130\" y=\"85\" width=\"700\" height=\"500\" rx=\"16\" fill=\"var(--space-2)\" stroke=\"var(--rule-2)\" stroke-width=\"1.5\"></rect>\n        <rect x=\"455\" y=\"83\" width=\"50\" height=\"8\" fill=\"var(--space-1)\"></rect>\n        <rect x=\"455\" y=\"583\" width=\"50\" height=\"8\" fill=\"var(--space-1)\"></rect>\n\n        <!-- ===== INBOUND DOCK (outside top) ===== -->\n        <g class=\"card\" id=\"z-inbound\">\n          <rect class=\"cardbg\" x=\"390\" y=\"26\" width=\"180\" height=\"34\" rx=\"6\"></rect>\n          <text class=\"zlabel\" x=\"480\" y=\"47\" text-anchor=\"middle\">INBOUND DOCK</text>\n        </g>\n\n        <!-- ===== RETURNS ZONE ===== -->\n        <g class=\"card\" id=\"z-returns\">\n          <rect class=\"cardbg\" x=\"155\" y=\"130\" width=\"200\" height=\"72\" rx=\"10\"></rect>\n          <g class=\"icon\" transform=\"translate(175,155)\">\n            <path d=\"M2,11 a7,7 0 1 0 2,-8\"></path>\n            <path d=\"M4,-1 L4,4 L9,4\" fill=\"none\"></path>\n          </g>\n          <text class=\"zlabel\" x=\"205\" y=\"162\">RETURNS ZONE</text>\n          <text class=\"zsub\" x=\"205\" y=\"180\">Inbound returns</text>\n        </g>\n\n        <!-- ===== RECEIVE ZONE ===== -->\n        <g class=\"card\" id=\"z-receive\">\n          <rect class=\"cardbg\" x=\"595\" y=\"130\" width=\"220\" height=\"72\" rx=\"10\"></rect>\n          <g class=\"icon\" transform=\"translate(615,155)\">\n            <rect x=\"1\" y=\"3\" width=\"16\" height=\"13\" rx=\"1.5\"></rect>\n            <path d=\"M9,6 L9,12 M6,9 L9,12 L12,9\"></path>\n          </g>\n          <text class=\"zlabel\" x=\"645\" y=\"162\">RECEIVE ZONE</text>\n          <text class=\"zsub\" x=\"645\" y=\"180\">Inbound stock</text>\n        </g>\n\n        <!-- ===== STOW ZONE ===== -->\n        <g class=\"card\" id=\"z-stow\">\n          <rect class=\"cardbg\" x=\"595\" y=\"238\" width=\"220\" height= dur+'ms ease');\n    el.getBoundingClientRect();\n    el.style.opacity = '1';\n    if(transform!==undefined && transform!==null) el.style.transform = transform;\n  }\n  function hide(el, dur){\n    if(typeof el === 'string') el = $(el);\n    dur = (dur===undefined)?300:dur;\n    el.style.transition = 'opacity '+dur+'ms ease';\n    el.style.opacity = '0';\n  }\n  function setT(el, transform){ if(typeof el==='string') el=$(el); el.style.transform = transform; }\n  function highlight(id, on){\n    var c=$(id);\n    if(on){ cards.forEach(function(card){ card.classList.remove('active'); }); c.classList.add('active'); }\n    else c.classList.remove('active');\n  }\n  function pulse(el, scale, dur){\n    if(typeof el==='string') el=$(el);\n    dur = dur||300; scale = scale||1.06;\n    el.style.transition = 'transform '+(dur/2)+'ms ease';\n    el.style.transform = 'scale('+scale+')';\n    setTimeout(function(){ el.style.transform = 'scale(1)'; }, dur/2);\n  }\n\n  /* ---------- intervals / timers we must clear on reset ---------- */\n  var timers = [];\n  function later(fn, ms){ if(INSTANT){ try{ fn(); }catch(e){} return; } var t = setTimeout(fn, ms); timers.push(t); return t; }\n  function every(fn, ms){ var t = setInterval(fn, ms); timers.push(t); return t; }\n  function clearTimers(){ timers.forEach(function(t){ clearTimeout(t); clearInterval(t); }); timers = []; }\n\n  /* ---------- TIMELINE ---------- */\n  var END = 46000;\n  var actions = [];\n  function at(t, fn){ actions.push({t:t, fn:fn}); }\n\n  // PHASE 0 — establish\n  at(0, function(){\n    boundary.style.opacity = '1';\n    boundary.style.transition = 'opacity 250ms ease';\n    boundary.style.strokeDasharray = boundaryLen;\n    boundary.style.strokeDashoffset = boundaryLen;\n    boundary.getBoundingClientRect();\n    boundary.style.transition = 'stroke-dashoffset 600ms ease, opacity 250ms ease';\n    requestAnimationFrame(function(){ boundary.style.strokeDashoffset = 0; });\n  });\n  var revealOrder = ['z-inbound','z-returns','z-receive','z-stow','z-problem','z-pick','z-pack1','z-pack2','z-pack3','z-ship'];\n  revealOrder.forEach(function(id, i){\n    at(250 + i*150, function(){ show(id, null, 450); });\n  });\n\n  // PHASE 1 — Inbound dock\n  at(2000, function(){ animateArrow($('a1trunk')); });\n  at(2400, function(){ zoomTo(480,55,2.8,900); });\n  at(3300, function(){\n    var p = $('p1-pkg'); p.style.transition='none'; setT(p,'translateY(-30px)'); p.getBoundingClientRect();\n    show(p, 'translateY(0px)', 600);\n  });\n  at(3900, function(){\n    hide('p1-pkg', 200);\n    show('p1-left', 'translate(-24px,12px)', 500);\n    show('p1-right', 'translate(24px,12px)', 500);\n    show('p1-l20', 'translate(-24px,12px)', 500);\n    show('p1-r80', 'translate(24px,12px)', 500);\n  });\n  at(5300, function(){\n    zoomOut(900);\n    ['p1-left','p1-right','p1-l20','p1-r80'].forEach(function(id){ hide(id,400); });\n  });\n  at(6200, function(){ animateArrow($('a1L')); animateArrow($('a1R')); });\n\n  // PHASE 2 — Returns\n  at(6500, function(){ highlight('z-returns', true); });\n  at(6800, function(){ zoomTo(255,165,2.8,900); });\n  at(7700, function(){\n    var p=$('p2-pkg'); p.style.transition='none'; setT(p,'translate(18px,-14px)'); p.getBoundingClientRect();\n    show(p,'translate(0px,0px)',500);\n    var g=$('p2-glass'); g.style.transition='none'; setT(g,'scale(0)'); g.getBoundingClientRect();\n    show(g,'scale(1)',300);\n  });\n  at(8200, function(){ hide('p2-glass',250); show('p2-check',null,250); });\n  at(8500, function(){ show('p2-label',null,300); });\n  at(9000, function(){ zoomOut(900); ['p2-pkg','p2-check','p2-label'].forEach(function(id){ hide(id,400); }); });\n  at(9900, function(){ highlight('z-returns', false); });\n  at(10200, function(){ animateArrow($('a2')); });\n\n  // PHASE 3 — Receive\n  at(11000, function(){ highlight('z-receive', true); });\n  at(11300, function(){ zoomTo(695,165,2.8,900); });\n  at(12200, function(){ show('p3-label',null,300); });\n  at(13700, function(){ zoomOut(900); hide('p3-label',400); });\n  at(14600, function(){ animateArrow($('a3')); });\n\n  // PHASE 4 — Stow\n  at(15500, function(){ highlight('z-stow', true); });\n  at(15800, function(){ zoomTo(695,270,2.8,900); });\n  at(16700, function(){\n    var p=$('p4-box'); p.style.transition='none'; setT(p,'translateX(30px)'); p.style.opacity='0'; p.getBoundingClientRect();\n    show(p,'translateX(0px)',500);\n    var rows = svg.querySelectorAll('.p4row');\n    rows.forEach(function(r,i){ later(function(){ show(r,null,250); }, i*200); });\n  });\n  at(17500, function(){ show('p4-label',null,300); });\n  at(18200, function(){ animateArrow($('a5stub')); });\n  at(18500, function(){ zoomOut(900); ['p4-box','p4-label'].forEach(function(id){ hide(id,400); }); svg.querySelectorAll('.p4row').forEach(function(r){ hide(r,400); }); });\n  at(19400, function(){ animateArrow($('a4')); });\n\n  // PHASE 5 — Problem Center\n  at(20000, function(){ highlight('z-problem', true); });\n  at(20300, function(){ zoomTo(695,360,2.8,900); });\n  at(21200, function(){\n    pulse($('warn-icon'), 1.15, 400);\n    show('p5-box',null,300); show('p5-x',null,300); show('p5-label',null,300);\n  });\n  at(21800, function(){ hide('p5-x',200); show('p5-check',null,250); });\n  at(22200, function(){ zoomOut(900); ['p5-box','p5-check','p5-label'].forEach(function(id){ hide(id,400); }); hideArrow($('a5stub')); });\n  at(23100, function(){ highlight('z-problem', false); animateArrow($('a5')); });\n\n  // PHASE 6 — Pick Zone\n  at(24500, function(){ highlight('z-pick', true); pulse($('z-pick'), 1.02, 300); });\n  at(24800, function(){ zoomTo(265,316,2.8,900); });\n  at(25700, function(){\n    var fills = svg.querySelectorAll('.binfill');\n    fills.forEach(function(f,i){ later(function(){ show(f,null,200); }, i*80); });\n  });\n  at(26400, function(){\n    var cur = $('p6-cursor');\n    cur.style.transition='none'; setT(cur,'translate(180px,350px)'); cur.getBoundingClientRect();\n    show(cur, 'translate(180px,350px)', 200);\n    var cells = [[180,350],[202,350],[191,372]];\n    cells.forEach(function(c,i){\n      later(function(){ cur.style.transition='transform 500ms ease'; setT(cur,'translate('+c[0]+'px,'+c[1]+'px)'); }, 300 + i*600);\n      later(function(){\n        var pk = $('p6-pk'+(i+1));\n        pk.style.transition='none'; setT(pk,'translate(0px,0px)'); pk.style.opacity='0'; pk.getBoundingClientRect();\n        show(pk,'translate(0px,0px)',1);\n        requestAnimationFrame(function(){ pk.style.transition='opacity 400ms ease, transform 400ms ease'; setT(pk,'translate(0px,22px)'); pk.style.opacity='0'; });\n      }, 600 + i*600);\n    });\n  });\n  at(28200, function(){ show('p6-label',null,300); var c=$('p6-count'); c.textContent='3 items picked'; show(c,null,300); });\n  at(28800, function(){\n    zoomOut(900);\n    hide('p6-cursor',300); hide('p6-label',400); hide('p6-count',400);\n    svg.querySelectorAll('.binfill').forEach(function(f){ hide(f,400); });\n  });\n  at(29700, function(){\n    animateArrow($('a678trunk'), 500);\n    later(function(){ animateArrow($('a6d')); }, 400);\n    later(function(){ animateArrow($('a7d')); }, 500);\n    later(function(){ animateArrow($('a8d')); }, 600);\n  });\n\n  // PHASE 7 — Pack stations\n  at(30500, function(){ highlight('z-pack2', true); });\n  at(30800, function(){ zoomTo(480,464,2.8,900); });\n  at(31700, function(){\n    ['pk1-lid','pk2-lid','pk3-lid'].forEach(function(id,i){\n      later(function(){\n        var l=$(id); l.style.transition='none'; setT(l,'translateY(-8px)'); l.getBoundingClientRect();\n        show(l,'translateY(0px)',300);\n      }, i*200);\n    });\n  });\n  at(32300, function(){ ['pk1-mark','pk2-mark','pk3-mark'].forEach(function(id,i){ later(function(){ show(id,null,250); }, i*120); }); });\n  at(32800, function(){ show('p7-label',null,300); });\n  at(33200, function(){\n    zoomOut(900);\n    highlight('z-pack2', false);\n    ['pk1-lid','pk2-lid','pk3-lid','pk1-mark','pk2-mark','pk3-mark','p7-label'].forEach(function(id){ hide(id,400); });\n  });\n  at(34100, function(){ animateArrow($('a9')); });\n\n  // PHASE 8 — Shipping dock\n  at(35000, function(){ highlight('z-ship', true); pulse($('z-ship'),1.03,300); });\n  at(35300, function(){ zoomTo(480,541,2.8,900); });\n  at(36200, function(){\n    ['p8-b1','p8-b2','p8-b3'].forEach(function(id,i){\n      later(function(){\n        var b=$(id); b.style.transition='none'; setT(b,'translateX(-30px)'); b.style.opacity='0'; b.getBoundingClientRect();\n        show(b,'translateX(0px)',300);\n      }, i*200);\n    });\n  });\n  at(36900, function(){ pulse($('ship-truck'),1.1,300); });\n  at(37100, function(){ show('p8-label',null,300); });\n  at(37500, function(){ zoomOut(900); ['p8-b1','p8-b2','p8-b3','p8-label'].forEach(function(id){ hide(id,400); }); });\n  at(38400, function(){ animateArrow($('a10')); });\n\n  // PHASE 9 — Final: truck loads & leaves\n  at(40500, function(){\n    var t=$('truck'); t.style.transition='opacity 400ms ease'; t.getBoundingClientRect(); t.style.opacity='1';\n  });\n  at(41000, function(){\n    var xs=[462,484,506];\n    ['lb1','lb2','lb3'].forEach(function(id,i){\n      later(function(){\n        var b=$(id); b.setAttribute('x', xs[i]);\n        b.style.transition='none'; setT(b,'translateY(-20px)'); b.style.opacity='0'; b.getBoundingClientRect();\n        b.style.transition='opacity 300ms ease, transform 300ms ease';\n        requestAnimationFrame(function(){ b.style.opacity='1'; setT(b,'translateY(8px)'); });\n      }, i*250);\n    });\n  });\n  at(42000, function(){\n    $('wheel1').classList.add('rolling');\n    $('wheel2').classList.add('rolling');\n    var drive = INSTANT ? 'none' : 'transform 2500ms cubic-bezier(0.42,0,1,1)';\n    var t=$('truck'); t.style.transition = drive; t.style.transform='translateX(700px)';\n    var lbg=$('loadboxes'); lbg.style.transition = drive; lbg.style.transform='translateX(700px)';\n  });\n  at(44700, function(){\n    warehouse.style.transition = INSTANT ? 'none' : 'opacity 800ms ease';\n    warehouse.style.opacity='0.35';\n    var b=$('brand'); b.style.transition = INSTANT ? 'none' : 'opacity 600ms ease'; b.style.opacity='1';\n  });\n  at(45600, function(){ $('ctrl').classList.add('show'); });\n\n  actions.sort(function(a,b){ return a.t - b.t; });\n\n  /* ---------- debug seek (instant state, for stills) ---------- */\n  window.__goto = function(ms){\n    INSTANT = true;\n    resetAll();\n    boundary.style.opacity='1'; boundary.style.strokeDashoffset=0;\n    actions.forEach(function(a){ if(a.t<=ms){ try{ a.fn(); }catch(e){} } });\n    INSTANT = false;\n  };\n\n  /* ---------- reset ---------- */\n  function resetAll(){\n    clearTimers();\n    warehouse.style.transition='none';\n    warehouse.style.transform='translate(0,0) scale(1)';\n    warehouse.style.opacity='1';\n    arrowEls.forEach(hideArrow);\n    boundary.style.transition='none'; boundary.style.opacity='0';\n    boundary.style.strokeDasharray=boundaryLen; boundary.style.strokeDashoffset=boundaryLen;\n    cards.forEach(function(c){ c.classList.remove('active'); c.style.transition='none'; c.style.opacity='0'; c.style.transform='none'; });\n    props.forEach(function(p){ p.style.transition='none'; p.style.opacity='0'; p.style.transform='none'; });\n    $('a1-20').style.opacity='0'; $('a1-80').style.opacity='0';\n    $('p6-count').textContent='0 items picked';\n    $('truck').style.transition='none'; $('truck').style.transform='none'; $('truck').style.opacity='0';\n    $('loadboxes').style.transition='none'; $('loadboxes').style.transform='none';\n    $('wheel1').classList.remove('rolling'); $('wheel2').classList.remove('rolling');\n    $('brand').style.opacity='0';\n    $('progress').firstElementChild.style.transition='none';\n    $('progress').firstElementChild.style.width='0%';\n    $('ctrl').classList.remove('show');\n    fit.setAttribute('data-screen-label','00:00');\n  }\n\n  /* ---------- scheduler (setTimeout-based, per spec) ---------- */\n  var startTime = 0, labelIv = null;\n  function fmt(ms){ var s=Math.floor(ms/1000); var m=Math.floor(s/60); s=s%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }\n\n  function start(){\n    resetAll();\n    // let the reset styles commit, then play\n    requestAnimationFrame(function(){ requestAnimationFrame(function(){\n      startTime = performance.now();\n      // progress bar: single linear sweep over the whole timeline\n      var pf = $('progress').firstElementChild;\n      pf.style.transition = 'width ' + END + 'ms linear';\n      pf.style.width = '100%';\n      // schedule every action\n      actions.forEach(function(a){ timers.push(setTimeout(a.fn, a.t)); });\n      // end -> reveal replay control\n      timers.push(setTimeout(function(){ $('ctrl').classList.add('show'); }, END));\n      // per-second screen label for comment anchoring\n      labelIv = setInterval(function(){\n        var e = performance.now() - startTime;\n        fit.setAttribute('data-screen-label', fmt(Math.min(e, END)));\n        if(e >= END){ clearInterval(labelIv); }\n      }, 1000);\n      timers.push(labelIv);\n    }); });\n  }\n  $('replay').addEventListener('click', start);\n\n  // kick off\n  resetAll();\n  setTimeout(start, 400);\n})();\n<\/script>\n\n\n</body></html>"
