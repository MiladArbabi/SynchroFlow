app = 'synchroflow'
primary_region = 'arn'
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[build.args]
  VITE_PUBLIC_POSTHOG_KEY = "phc_kVdrQpoCzz5J7n9NzHW2gXHtwA6PC9gQJW294ajhpmrM"
  VITE_PUBLIC_POSTHOG_HOST = "https://t.lasyncro.com"

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    port = 8080
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
